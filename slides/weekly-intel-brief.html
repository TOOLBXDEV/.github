<title>Market Pulse</title>
<style>
  @font-face { font-family: 'Inter'; src: local('Inter'), local('DM Sans'), local('Calibri'); }
  :root {
    color-scheme: light;
    --black: #111113; --dark: #2C2C2E; --grey: #636366; --silver: #AEAEB2;
    --pale: #F2F2F7; --white: #FFFFFF;
    --yellow: #FFCA05; --yellow-soft: #FFF8E1;
    --teal: #1C8DA1; --teal-dark: #157080; --teal-pale: #E8F4F7;
    --red: #D32F2F; --red-pale: #FDECEA;
    --green: #2E7D32;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: 'Inter', 'DM Sans', Calibri, -apple-system, sans-serif; background: #ECEDF0; color: var(--black); padding: 20px 16px; font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased; }

  .slide { max-width: 1060px; margin: 0 auto; background: var(--white); border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 12px 40px rgba(0,0,0,.08); overflow: hidden; }

  .slide-top { background: var(--black); padding: 18px 32px 16px; display: flex; justify-content: space-between; align-items: flex-end; }
  .slide-brand { display: flex; align-items: center; gap: 10px; }
  .slide-logo { width: 4px; height: 28px; background: var(--yellow); border-radius: 2px; }
  .slide-title { font-family: Georgia, 'Bitter', serif; font-size: 20px; font-weight: 700; color: var(--white); letter-spacing: -0.02em; }
  .slide-title span { color: var(--yellow); }
  .slide-date { color: var(--silver); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; text-align: right; line-height: 1.4; }
  .slide-date strong { color: var(--white); display: block; font-family: Georgia, 'Bitter', serif; font-size: 13px; letter-spacing: 0.06em; }

  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--pale); }
  .metric { padding: 14px 20px; border-right: 1px solid var(--pale); text-align: center; }
  .metric:last-child { border-right: none; }
  .metric-val { font-family: Georgia, 'Bitter', serif; font-size: 26px; font-weight: 700; color: var(--black); line-height: 1; }
  .metric-val.zero { color: var(--silver); }
  .metric-lbl { font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--grey); margin-top: 4px; }

  .body { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  @media (max-width: 820px) { .body { grid-template-columns: 1fr; } }

  .col { padding: 16px 24px 18px; }
  .col + .col { border-left: 1px solid var(--pale); }
  .col-head { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; color: var(--teal); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .col-head::before { content: ''; width: 3px; height: 14px; background: var(--yellow); border-radius: 1px; }

  .card { background: var(--pale); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; border-left: 3px solid var(--silver); }
  .card.threat-high { border-left-color: var(--red); }
  .card.threat-medium { border-left-color: var(--yellow); }
  .card.threat-teal { border-left-color: var(--teal); }
  .card.threat-green { border-left-color: var(--green); }

  .card-head { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .card-name { font-weight: 700; font-size: 11.5px; color: var(--black); }
  .badge { font-size: 7px; padding: 2px 6px; border-radius: 999px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
  .badge-red { background: var(--red); color: var(--white); }
  .badge-yellow { background: var(--yellow); color: var(--black); }
  .badge-teal { background: var(--teal); color: var(--white); }
  .card-body { font-size: 10.5px; color: var(--dark); line-height: 1.4; }
  .card-source { font-size: 8px; color: var(--silver); margin-top: 4px; }
  .card-source a { color: var(--teal); text-decoration: none; font-weight: 600; }

  .theme-label { font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--grey); margin: 14px 0 6px; }
  .theme-label:first-child { margin-top: 0; }

  .item { display: flex; gap: 8px; margin-bottom: 8px; align-items: flex-start; }
  .item-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--teal); margin-top: 5px; flex-shrink: 0; }
  .item-content { flex: 1; min-width: 0; }
  .item-title { font-weight: 700; font-size: 11px; color: var(--black); }
  .item-text { font-size: 10px; color: var(--grey); line-height: 1.35; margin-top: 1px; }
  .item-meta { font-size: 7.5px; color: var(--silver); margin-top: 2px; font-weight: 600; }
  .item-meta a { color: var(--teal); text-decoration: none; }

  .empty { font-size: 10px; color: var(--silver); padding: 6px 0; }

  .slide-footer { padding: 8px 24px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--pale); }
  .slide-footer span { font-size: 8px; color: var(--silver); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .slide-footer .ft-brand { font-family: Georgia, 'Bitter', serif; color: var(--black); font-weight: 700; font-size: 9px; }
</style>

<div class="slide">
  <div class="slide-top">
    <div class="slide-brand">
      <div class="slide-logo"></div>
      <div class="slide-title">Market <span>Pulse</span></div>
    </div>
    <div class="slide-date" id="slide-date"></div>
  </div>

  <div class="metrics">
    <div class="metric"><div class="metric-val" id="m-tracked"></div><div class="metric-lbl">Tracked</div></div>
    <div class="metric"><div class="metric-val" id="m-news"></div><div class="metric-lbl">Activity This Week</div></div>
    <div class="metric"><div class="metric-val" id="m-losses"></div><div class="metric-lbl">Losses</div></div>
    <div class="metric"><div class="metric-val" id="m-entrants"></div><div class="metric-lbl">New Entrants</div></div>
  </div>

  <div class="body">
    <div class="col">
      <div class="col-head">Competitor Activity</div>
      <div id="activity"></div>
      <div class="theme-label" style="margin-top:16px">Losses This Week</div>
      <div id="losses"></div>
    </div>
    <div class="col">
      <div class="col-head">What We're Hearing</div>
      <div id="hearing"></div>
    </div>
  </div>

  <div class="slide-footer">
    <span class="ft-brand">TOOLBX</span>
    <span>Web Research &middot; Gong &middot; HubSpot</span>
  </div>
</div>

<script>
try {
  var _nextMon = function(d) {
    var dow = d.getDay();
    var off = dow === 1 ? 0 : ((1 - dow + 7) % 7);
    var r = new Date(d.getFullYear(), d.getMonth(), d.getDate() + off);
    r.setHours(0,0,0,0);
    return r;
  };
  var _fmt = function(d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
  var now = new Date(Date.now() - 86400000);
  var mon = _nextMon(now);
  var wkStart = new Date(mon.getTime() - 7 * 86400000);
  var sy = new Date(mon.getFullYear(), 0, 1);
  var wn = Math.ceil(((mon - sy) / 86400000 + sy.getDay() + 1) / 7);
  document.getElementById('slide-date').innerHTML = '<strong>W' + wn + '</strong>' + _fmt(wkStart) + ' - ' + _fmt(new Date(mon.getTime() - 86400000));
} catch(e) {}
</script>

<script>
var ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s) { return s == null ? '' : String(s).replace(/[&<>"']/g, function(c){return ESC[c];}); }

var DATA = {
  tracked: 20,
  news: [
    {
      name: 'Unilog',
      threat: 'medium',
      text: 'Won 8/10 gold medals in 2026 Paradigm B2B Combine -- top marks for AI, content management, and sales enablement',
      src: 'EIN Presswire, Jul 21',
      url: 'https://www.einnews.com/pr_news/928312923/unilog-wins-eight-gold-medals-in-2026-paradigm-b2b-combine'
    }
  ],
  losses: [],
  entrants: [],
  themes: [
    {
      label: 'Competitive Mentions',
      items: [
        { title: 'Big-Box Pressure', text: 'HD/Lowe\'s pro apps setting contractor expectations dealers feel they must match', who: '10 accounts incl. Smick, Stockham, Tague, R.P. Lumber, Franklin', url: 'https://us-43298.app.gong.io/call?id=5696443663530162994' },
        { title: 'Epicor Lock-in', text: 'Dealers compare us against Epicor\'s own e-commerce; changing API fees create friction', who: '8 accounts incl. TAL, Tague, R.P. Lumber, Franklin', url: 'https://app.gong.io/call?id=7634502219134060654' }
      ]
    },
    {
      label: 'Feature Gaps',
      items: [
        { title: 'Blueprint-to-Order', text: 'Contractors send plans not lists -- need takeoff tool. HD already has one', who: 'Ganahl, Franklin, TAL', url: 'https://app.gong.io/call?id=1288530892711481686' },
        { title: 'Mobile App', text: 'Job-site ordering on phones -- ERP portals aren\'t mobile-friendly', who: 'TAL, Kansas Lumber, Bliffert', url: 'https://app.gong.io/call?id=7634502219134060654' }
      ]
    },
    {
      label: 'Pain Points',
      items: [
        { title: 'ERP Integration', text: 'Syncing catalogs/pricing/customers takes weeks and delays launches', who: '10 accounts incl. R.P. Lumber, Franklin, TAL, Tague', url: 'https://app.gong.io/call?id=8763242451987280498' },
        { title: 'AR Collection', text: '80% of customers require payment chasing; teams track on sticky notes', who: 'Dewitt, Tibbetts, Espy, Kansas, Stockham', url: null }
      ]
    }
  ]
};

function renderMetrics() {
  var t = DATA.tracked, n = DATA.news.length, l = DATA.losses.length, e = DATA.entrants.length;
  document.getElementById('m-tracked').textContent = t;
  var ne = document.getElementById('m-news'); ne.textContent = n; if(!n) ne.className = 'metric-val zero';
  var le = document.getElementById('m-losses'); le.textContent = l; if(!l) le.className = 'metric-val zero';
  var ee = document.getElementById('m-entrants'); ee.textContent = e; if(!e) ee.className = 'metric-val zero';
}

function renderActivity() {
  var el = document.getElementById('activity');
  if (!DATA.news.length && !DATA.entrants.length) {
    el.innerHTML = '<div class="empty">Quiet week across ' + DATA.tracked + ' battlecards</div>';
    return;
  }
  var h = '';
  for (var i = 0; i < DATA.news.length; i++) {
    var n = DATA.news[i];
    var bc = n.threat === 'high' ? 'threat-high' : (n.threat === 'medium' ? 'threat-medium' : 'threat-teal');
    var bb = n.threat === 'high' ? 'badge-red' : (n.threat === 'medium' ? 'badge-yellow' : 'badge-teal');
    h += '<div class="card ' + bc + '">';
    h += '<div class="card-head"><span class="card-name">' + esc(n.name) + '</span><span class="badge ' + bb + '">' + esc(n.threat) + '</span></div>';
    h += '<div class="card-body">' + esc(n.text) + '</div>';
    if (n.url) h += '<div class="card-source"><a href="' + esc(n.url) + '" target="_blank">' + esc(n.src) + '</a></div>';
    else if (n.src) h += '<div class="card-source">' + esc(n.src) + '</div>';
    h += '</div>';
  }
  for (var j = 0; j < DATA.entrants.length; j++) {
    var e = DATA.entrants[j];
    h += '<div class="card threat-teal">';
    h += '<div class="card-head"><span class="card-name">' + esc(e.name) + '</span><span class="badge badge-teal">New</span></div>';
    h += '<div class="card-body">' + esc(e.text) + '</div>';
    h += '</div>';
  }
  el.innerHTML = h;
}

function renderLosses() {
  var el = document.getElementById('losses');
  if (!DATA.losses.length) { el.innerHTML = '<div class="empty">None this week</div>'; return; }
  var h = '';
  for (var i = 0; i < DATA.losses.length; i++) {
    var d = DATA.losses[i];
    h += '<div class="card threat-high">';
    h += '<div class="card-name">' + esc(d.name) + '</div>';
    h += '<div class="card-body">' + esc(d.detail) + '</div>';
    h += '</div>';
  }
  el.innerHTML = h;
}

function renderHearing() {
  var el = document.getElementById('hearing');
  var h = '';
  for (var t = 0; t < DATA.themes.length; t++) {
    var theme = DATA.themes[t];
    h += '<div class="theme-label">' + esc(theme.label) + '</div>';
    for (var i = 0; i < theme.items.length; i++) {
      var it = theme.items[i];
      h += '<div class="item">';
      h += '<div class="item-dot"></div>';
      h += '<div class="item-content">';
      h += '<div class="item-title">' + esc(it.title) + '</div>';
      h += '<div class="item-text">' + esc(it.text) + '</div>';
      h += '<div class="item-meta">' + esc(it.who);
      if (it.url) h += ' &middot; <a href="' + esc(it.url) + '" target="_blank">Recording</a>';
      h += '</div></div></div>';
    }
  }
  el.innerHTML = h;
}

renderMetrics();
renderActivity();
renderLosses();
renderHearing();
</script>
