<title>Market Pulse</title>
<style>
  :root {
    color-scheme: light;
    --slate-black: #1C1C1E; --dark-grey: #494949; --silver-grey: #CCCCCC;
    --light-grey: #F2F2F2; --white: #FFFFFF;
    --sunrise-yellow: #FFCA05; --won-bg: #FFF8E1;
    --metallic-seaweed: #457F86; --lost-red: #B91C1C;
    --teal: #1C8DA1; --teal-lt: #93C1C8;
    --amber: #E67E22;
    --violet: #7C3AED;
  }
  * { box-sizing: border-box; }
  body { font-family: "DM Sans", Calibri, Arial, sans-serif; background: #e6e7eb; color: var(--slate-black); margin: 0; padding: 24px 16px; font-size: 14px; line-height: 1.45; }

  .deck-header { max-width: 1080px; margin: 0 auto 18px; display: flex; justify-content: space-between; align-items: center; color: var(--dark-grey); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; padding: 0 4px; }
  .deck-header strong { color: var(--slate-black); }

  .slide { max-width: 1080px; margin: 0 auto 20px; background: var(--white); border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06); position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .slide-header { padding: 22px 36px 8px; display: flex; justify-content: space-between; align-items: flex-start; flex-shrink: 0; }
  .slide-eyebrow { color: var(--silver-grey); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; margin-bottom: 4px; }
  .slide-title-row { display: flex; align-items: center; gap: 12px; }
  .yellow-bar { display: inline-block; width: 6px; height: 30px; background: var(--sunrise-yellow); flex-shrink: 0; }
  .slide-title { font-family: Georgia, "Bitter", serif; font-size: 22px; font-weight: 700; color: var(--slate-black); letter-spacing: -0.01em; margin: 0; line-height: 1.15; }
  .slide-stamp { font-family: Georgia, "Bitter", serif; font-weight: 700; color: var(--silver-grey); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; }

  .slide-body { padding: 14px 28px 18px; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .slide-footer { padding: 10px 36px 14px; display: flex; justify-content: space-between; align-items: center; color: var(--dark-grey); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; border-top: 1px solid var(--light-grey); flex-shrink: 0; }
  .slide-footer .brand { font-family: Georgia, "Bitter", serif; color: var(--slate-black); font-weight: 700; }

  .intel-section { margin-bottom: 14px; }
  .intel-section h3 { margin: 0 0 10px; font-size: 12px; color: var(--slate-black); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 14px; border-left: 4px solid var(--sunrise-yellow); background: linear-gradient(90deg, rgba(28,141,161,0.07) 0%, transparent 60%); border-radius: 0 2px 2px 0; }

  .news-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .news-card { background: var(--light-grey); padding: 8px 12px; border-radius: 2px; border-left: 3px solid var(--sunrise-yellow); flex: 1; min-width: 220px; }
  .news-card.high { border-left-color: var(--lost-red); }
  .news-card-head { display: flex; align-items: center; gap: 6px; }
  .news-card-name { font-weight: 700; font-size: 11.5px; }
  .threat-pill { display: inline-block; font-size: 7.5px; padding: 1px 6px; border-radius: 999px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .threat-pill.high { background: var(--lost-red); color: var(--white); }
  .threat-pill.medium { background: var(--sunrise-yellow); color: var(--slate-black); }
  .news-card-body { font-size: 10.5px; color: var(--dark-grey); margin-top: 3px; line-height: 1.35; }
  .news-card-src { font-size: 8.5px; color: var(--silver-grey); margin-top: 3px; }
  .news-card-src a { color: var(--teal); text-decoration: none; font-weight: 600; }
  .news-card-src a:hover { text-decoration: underline; }

  .hearing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  @media (max-width: 820px) { .hearing-grid { grid-template-columns: 1fr; } }

  .theme-block { padding: 0; }
  .theme-block-header { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; padding-bottom: 8px; border-bottom: 1px solid var(--light-grey); }
  .category-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .category-dot.teal { background: var(--teal); }
  .category-dot.amber { background: var(--amber); }
  .category-dot.violet { background: var(--violet); }
  .theme-block-label { font-size: 11px; font-weight: 700; color: var(--slate-black); text-transform: uppercase; letter-spacing: 0.08em; }

  .theme-item { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,0.04); }
  .theme-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
  .theme-item-title { font-weight: 700; font-size: 12px; color: var(--slate-black); line-height: 1.3; }
  .theme-item-text { font-size: 10px; color: var(--dark-grey); line-height: 1.35; margin-top: 2px; }
  .cited-by { font-size: 9px; color: var(--silver-grey); margin-top: 3px; line-height: 1.3; }
  .cited-by-label { font-size: 7.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--silver-grey); }

  .trend-badge { display: inline-block; font-size: 7.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 5px; border-radius: 2px; margin-left: 6px; vertical-align: middle; position: relative; top: -1px; }
  .trend-badge.recurring { background: rgba(28,141,161,0.12); color: var(--teal); }

  .empty-state { background: var(--light-grey); border-radius: 2px; padding: 6px 12px; font-size: 10px; color: var(--silver-grey); }
  .data-note { font-size: 8.5px; color: var(--silver-grey); margin-top: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }

  .bottom-line { margin: 0; padding: 8px 14px; font-size: 11px; font-weight: 600; color: var(--slate-black); line-height: 1.4; border-left: 4px solid var(--sunrise-yellow); background: var(--won-bg); border-radius: 0 2px 2px 0; }

  .source-link { color: var(--teal); text-decoration: none; font-weight: 600; }
  .source-link:hover { text-decoration: underline; }
</style>

<div class="deck-header">
  <span><strong>TOOLBX</strong> &middot; Market Pulse</span>
  <span id="deck-date"></span>
</div>

<div class="slide">
  <div class="slide-header">
    <div>
      <div class="slide-eyebrow">Weekly Overview</div>
      <div class="slide-title-row"><span class="yellow-bar"></span><h2 class="slide-title">Market Pulse</h2></div>
    </div>
    <div class="slide-stamp" id="week-stamp"></div>
  </div>
  <div class="slide-body">
    <div class="intel-section">
      <h3>Competitor Activity</h3>
      <div class="news-row" id="activity-news"></div>
    </div>

    <div class="intel-section">
      <h3>What We're Hearing &mdash; Trends</h3>
      <div class="hearing-grid" id="hearing-grid"></div>
      <div class="data-note" id="data-note"></div>
    </div>

    <div id="bottom-line"></div>
  </div>
  <div class="slide-footer"><span class="brand">TOOLBX&trade;</span><span>Source: Web Research &middot; Gong</span></div>
</div>

<script>
try {
  var _nextMon = function(d) {
    var dow = d.getDay();
    var off = dow === 1 ? 0 : ((1 - dow + 7) % 7);
    var r = new Date(d.getFullYear(), d.getMonth(), d.getDate() + off);
    r.setHours(0,0,0,0);
    return r;
  };
  var _fmt = function(d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
  var now = new Date(Date.now() - 86400000);
  var mon = _nextMon(now);
  var wkStart = new Date(mon.getTime() - 7 * 86400000);
  var wkEnd = new Date(mon.getTime() - 1000);
  document.getElementById('deck-date').textContent = _fmt(wkStart) + ' — ' + _fmt(wkEnd);
  var sy = new Date(mon.getFullYear(), 0, 1);
  var wn = Math.ceil(((mon - sy) / 86400000 + sy.getDay() + 1) / 7);
  document.getElementById('week-stamp').textContent = 'W' + wn;
} catch(e) {
  try { document.getElementById('deck-date').textContent = ''; } catch(e2) {}
}
</script>

<script>
var ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s) { return s == null ? '' : String(s).replace(/[&<>"']/g, function(c){return ESC[c];}); }

var DATA = {
  keySignal: 'ECI ecosystem friction spans two weeks and multiple accounts -- strongest recurring signal in the window.',
  window: {
    start: '2026-08-18',
    end: '2026-09-14',
    weeksIncluded: 4,
    currentWeek: { start: '2026-09-08', end: '2026-09-14' }
  },
  meta: { activeDealCount: 10, totalDealCount: 50 },
  news: [
    { name: 'WizCommerce Launches WizCRM', threat: 'medium', text: 'WizCommerce launched WizCRM, an AI-first CRM for wholesalers and distributors integrated into their sales platform. Includes WizPilot, an AI assistant that answers customer questions, prepares meeting briefs, flags stale quotes, and identifies reorder opportunities -- directly competing with Toolbx\'s CRM positioning in B2B distribution.', url: 'https://www.practicalecommerce.com/new-ecommerce-tools-september-8-2026', src: 'Practical Ecommerce' },
    { name: 'Canada/US Tariffs Hit Building Materials', threat: 'medium', text: 'Canada\'s retaliatory counter-tariffs on CA$27.6B of US goods took effect Sep 8 at rates up to 50%, hitting construction materials, steel, and lumber. US tariffs on Canadian softwood lumber now sit at ~34.83%. Canadian lumber accounts for ~85% of US softwood imports -- price volatility is accelerating the case for real-time digital ordering.', url: 'https://www.cnbc.com/2026/09/08/canada-retaliatory-tariffs.html', src: 'CNBC' }
  ],
  themes: [
    { label: 'Feature Gaps', dotColor: 'teal', items: [
      { title: 'Canadian EFT Payment Support', summary: 'No EFT support for Canadian payments; dealers rely on EFT as the standard electronic method.', trend: { direction: 'new', weeksActive: 1, firstSeen: '2026-09-08' }, mentions: { total: 1, uniqueCompanies: 1 }, citedBy: [{ company: 'Caliper Forest Products', weeksAgo: 0 }], gongUrls: ['https://app.gong.io/call?id=2715045927719169875'] },
      { title: 'Eagle SKU Lifecycle Sync', summary: 'Eagle flat-file integration forces manual dual-maintenance of SKU catalogs -- hours per week.', trend: { direction: 'new', weeksActive: 1, firstSeen: '2026-09-08' }, mentions: { total: 1, uniqueCompanies: 1 }, citedBy: [{ company: 'E.L. Spear Lumber', weeksAgo: 0 }], gongUrls: ['https://app.gong.io/call?id=2722916136876151873'] },
      { title: 'LumberTrack ERP Integration', summary: 'Do it Best asked about LumberTrack connectivity; volunteered as anchor design partner.', trend: { direction: 'new', weeksActive: 1, firstSeen: '2026-09-08' }, mentions: { total: 1, uniqueCompanies: 1 }, citedBy: [{ company: 'Do it Best', weeksAgo: 0 }], gongUrls: ['https://app.gong.io/call?id=8440102199568766466'] }
    ]},
    { label: 'Pain Points', dotColor: 'amber', items: [
      { title: 'ECI Closed-Ecosystem API Barriers', summary: 'ECI refuses third-party integrations and inflates API pricing to push their own Evo X e-commerce.', trend: { direction: 'continuing', weeksActive: 2, firstSeen: '2026-09-01' }, mentions: { total: 2, uniqueCompanies: 2 }, citedBy: [{ company: 'CNRG/Orgill', weeksAgo: 0 }, { company: 'Buying-Group Dealer', weeksAgo: 1 }], gongUrls: ['https://app.gong.io/call?id=2280563053918686055'] },
      { title: 'Spruce/ECI Platform Failure', summary: 'Stones nearing decision to leave Spruce -- 150 online-paying customers ready to migrate.', trend: { direction: 'new', weeksActive: 1, firstSeen: '2026-09-08' }, mentions: { total: 1, uniqueCompanies: 1 }, citedBy: [{ company: 'Stones Home Centers', weeksAgo: 0 }], gongUrls: ['https://app.gong.io/call?id=1467970317760917058'] }
    ]},
    { label: 'Objections', dotColor: 'violet', items: [] }
  ]
};

function renderBottomLine() {
  var el = document.getElementById('bottom-line');
  if (DATA.keySignal) {
    el.innerHTML = '<div class="bottom-line"><strong>Key signal:</strong> ' + esc(DATA.keySignal) + '</div>';
  }
}

function renderActivity() {
  var newsEl = document.getElementById('activity-news');
  var h = '';
  var hasNews = DATA.news && DATA.news.length > 0;
  if (!hasNews) {
    h = '<div class="empty-state">No competitor activity this week</div>';
  } else {
    for (var i = 0; i < DATA.news.length; i++) {
      var n = DATA.news[i];
      h += '<div class="news-card' + (n.threat === 'high' ? ' high' : '') + '">';
      h += '<div class="news-card-head"><span class="news-card-name">' + esc(n.name) + '</span>';
      h += '<span class="threat-pill ' + esc(n.threat) + '">' + esc(n.threat) + '</span></div>';
      h += '<div class="news-card-body">' + esc(n.text) + '</div>';
      if (n.url) {
        h += '<div class="news-card-src"><a class="source-link" href="' + esc(n.url) + '" rel="noopener noreferrer" onclick="window.open(this.href);return false;">' + esc(n.src) + ' &#x2197;</a></div>';
      } else if (n.src) {
        h += '<div class="news-card-src">' + esc(n.src) + '</div>';
      }
      h += '</div>';
    }
  }
  newsEl.innerHTML = h;
}

function renderThemeBlock(theme) {
  if (!theme.items || theme.items.length === 0) {
    return '';
  }
  var dotClass = theme.dotColor || 'teal';
  var h = '<div class="theme-block">';
  h += '<div class="theme-block-header"><span class="category-dot ' + esc(dotClass) + '"></span>';
  h += '<span class="theme-block-label">' + esc(theme.label) + '</span></div>';
  for (var i = 0; i < theme.items.length; i++) {
    var it = theme.items[i];
    var isRecurring = it.trend && it.trend.weeksActive > 1;
    h += '<div class="theme-item">';
    h += '<div class="theme-item-title">' + esc(it.title);
    if (isRecurring) {
      h += ' <span class="trend-badge recurring">' + it.trend.weeksActive + 'w recurring</span>';
    }
    h += '</div>';
    if (it.summary) {
      h += '<div class="theme-item-text">' + esc(it.summary) + '</div>';
    }
    if (it.citedBy && it.citedBy.length > 0) {
      var names = [];
      for (var c = 0; c < it.citedBy.length; c++) {
        names.push(esc(it.citedBy[c].company));
      }
      h += '<div class="cited-by"><span class="cited-by-label">Cited by: </span>' + names.join(', ') + '</div>';
    }
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function renderHearing() {
  var gridEl = document.getElementById('hearing-grid');
  var h = '';
  for (var t = 0; t < DATA.themes.length; t++) {
    h += renderThemeBlock(DATA.themes[t]);
  }
  if (h === '') {
    h = '<div class="empty-state">No themes in this window</div>';
  }
  gridEl.innerHTML = h;
}

function renderDataNote() {
  var el = document.getElementById('data-note');
  var seen = {};
  var companies = [];
  for (var t = 0; t < DATA.themes.length; t++) {
    for (var i = 0; i < DATA.themes[t].items.length; i++) {
      var cb = DATA.themes[t].items[i].citedBy;
      if (cb) {
        for (var c = 0; c < cb.length; c++) {
          if (!seen[cb[c].company]) {
            seen[cb[c].company] = true;
            companies.push(cb[c].company);
          }
        }
      }
    }
  }
  var parts = ['Themes from Gong calls'];
  if (DATA.window) {
    var ws = DATA.window.start.replace(/-/g, '/');
    var we = DATA.window.end.replace(/-/g, '/');
    var s = new Date(ws);
    var e = new Date(we);
    var fmtShort = function(d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
    parts.push('Rolling ' + DATA.window.weeksIncluded + ' weeks (' + fmtShort(s) + ' – ' + fmtShort(e) + ')');
  }
  if (DATA.meta && DATA.meta.activeDealCount != null) {
    parts.push(DATA.meta.activeDealCount + ' of ' + DATA.meta.totalDealCount + ' deals active');
  }
  if (companies.length > 0) {
    parts.push(companies.join(', '));
  }
  el.innerHTML = parts.join(' &middot; ');
}

renderActivity();
renderHearing();
renderDataNote();
renderBottomLine();
</script>
