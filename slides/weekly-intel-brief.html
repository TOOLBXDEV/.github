<title>Market Pulse</title>
<style>
  :root {
    color-scheme: light;
    --slate-black: #1C1C1E; --dark-grey: #494949; --silver-grey: #CCCCCC;
    --light-grey: #F2F2F2; --white: #FFFFFF;
    --sunrise-yellow: #FFCA05; --won-bg: #FFF8E1;
    --metallic-seaweed: #457F86; --lost-red: #B91C1C;
    --teal: #1C8DA1; --teal-lt: #93C1C8;
  }
  * { box-sizing: border-box; }
  body { font-family: "DM Sans", Calibri, Arial, sans-serif; background: #e6e7eb; color: var(--slate-black); margin: 0; padding: 24px 16px; font-size: 14px; line-height: 1.45; }

  .deck-header { max-width: 1080px; margin: 0 auto 18px; display: flex; justify-content: space-between; align-items: center; color: var(--dark-grey); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; padding: 0 4px; }
  .deck-header strong { color: var(--slate-black); }

  .slide { max-width: 1080px; margin: 0 auto 20px; background: var(--white); border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06); position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .slide-header { padding: 22px 36px 8px; display: flex; justify-content: space-between; align-items: flex-start; flex-shrink: 0; }
  .slide-eyebrow { color: var(--silver-grey); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; margin-bottom: 4px; }
  .slide-title-row { display: flex; align-items: center; gap: 12px; }
  .yellow-bar { display: inline-block; width: 6px; height: 30px; background: var(--sunrise-yellow); flex-shrink: 0; }
  .slide-title { font-family: Georgia, "Bitter", serif; font-size: 22px; font-weight: 700; color: var(--slate-black); letter-spacing: -0.01em; margin: 0; line-height: 1.15; }
  .slide-stamp { font-family: Georgia, "Bitter", serif; font-weight: 700; color: var(--silver-grey); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; }

  .slide-body { padding: 14px 28px 18px; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .slide-footer { padding: 10px 36px 14px; display: flex; justify-content: space-between; align-items: center; color: var(--dark-grey); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; border-top: 1px solid var(--light-grey); flex-shrink: 0; }
  .slide-footer .brand { font-family: Georgia, "Bitter", serif; color: var(--slate-black); font-weight: 700; }

  .key-metrics-strip { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--slate-black); padding: 12px 4px; border-radius: 2px; column-gap: 1px; margin-bottom: 14px; }
  .key-metric-cell { padding: 0 12px; border-right: 1px solid #2A2A2C; }
  .key-metric-cell:last-child { border-right: none; }
  .key-metric-cell .lbl { color: var(--sunrise-yellow); font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .key-metric-cell .val { font-family: Georgia, "Bitter", serif; color: var(--white); font-size: 18px; font-weight: 700; line-height: 1; }
  .key-metric-cell .sub { color: var(--silver-grey); font-size: 9px; margin-top: 3px; }

  .intel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1; min-height: 0; }
  @media (max-width: 820px) { .intel-grid { grid-template-columns: 1fr; } }

  .intel-col { display: flex; flex-direction: column; min-height: 0; }
  .intel-col h3 { margin: 0 0 8px; font-size: 10.5px; color: var(--slate-black); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding-left: 10px; border-left: 3px solid var(--sunrise-yellow); }

  .section-label { font-size: 9px; font-weight: 700; color: var(--dark-grey); text-transform: uppercase; letter-spacing: 0.06em; margin: 12px 0 5px; }
  .section-label:first-of-type { margin-top: 0; }

  .news-card { background: var(--light-grey); padding: 8px 12px; border-radius: 2px; border-left: 3px solid var(--sunrise-yellow); margin-bottom: 5px; }
  .news-card.high { border-left-color: var(--lost-red); }
  .news-card-head { display: flex; align-items: center; gap: 6px; }
  .news-card-name { font-weight: 700; font-size: 11.5px; }
  .threat-pill { display: inline-block; font-size: 7.5px; padding: 1px 6px; border-radius: 999px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .threat-pill.high { background: var(--lost-red); color: var(--white); }
  .threat-pill.medium { background: var(--sunrise-yellow); color: var(--slate-black); }
  .news-card-body { font-size: 10.5px; color: var(--dark-grey); margin-top: 3px; line-height: 1.35; }
  .news-card-src { font-size: 8.5px; color: var(--silver-grey); margin-top: 3px; }
  .news-card-src a { color: var(--teal); text-decoration: none; font-weight: 600; }
  .news-card-src a:hover { text-decoration: underline; }

  .entrant-chip { background: var(--light-grey); padding: 6px 10px; border-radius: 2px; border-left: 3px solid var(--teal); margin-bottom: 5px; }
  .entrant-chip-head { font-weight: 700; font-size: 11px; }
  .entrant-chip-head .new-tag { display: inline-block; font-size: 7px; padding: 1px 5px; border-radius: 999px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; background: var(--teal); color: var(--white); margin-left: 5px; vertical-align: middle; }
  .entrant-chip-body { font-size: 10px; color: var(--dark-grey); margin-top: 2px; }

  .loss-chip { background: var(--light-grey); padding: 5px 9px; border-radius: 2px; font-size: 11px; border-left: 3px solid var(--lost-red); margin-bottom: 5px; }
  .loss-chip-name { font-weight: 700; }
  .loss-chip-meta { color: var(--dark-grey); font-size: 10px; margin-top: 1px; }
  .loss-chip-arr { font-weight: 700; font-variant-numeric: tabular-nums; font-family: Georgia, "Bitter", serif; }
  .loss-chip-detail { color: var(--dark-grey); font-size: 10px; margin-top: 1px; font-style: italic; }
  .competitor-tag { display: inline-block; margin-top: 2px; padding: 0px 5px; background: var(--white); color: var(--dark-grey); border: 1px solid var(--silver-grey); border-radius: 2px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }

  .theme-block { background: var(--light-grey); padding: 8px 12px; border-radius: 2px; border-left: 3px solid var(--teal); margin-bottom: 6px; }
  .theme-block h4 { margin: 0 0 5px; font-size: 10px; font-weight: 700; color: var(--teal); text-transform: uppercase; letter-spacing: 0.04em; }
  .theme-item { margin-bottom: 6px; }
  .theme-item:last-child { margin-bottom: 0; }
  .theme-item-title { font-weight: 700; font-size: 11px; color: var(--slate-black); }
  .theme-item-text { font-size: 10px; color: var(--dark-grey); line-height: 1.35; }
  .theme-item-meta { font-size: 8px; color: var(--silver-grey); margin-top: 2px; }
  .theme-item-meta a { color: var(--teal); text-decoration: none; font-weight: 600; }
  .theme-item-meta a:hover { text-decoration: underline; }

  .empty-state { background: var(--light-grey); border-radius: 2px; padding: 6px 12px; font-size: 10px; color: var(--silver-grey); border-left: 3px solid var(--light-grey); }
  .data-note { font-size: 8.5px; color: var(--silver-grey); margin-top: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
</style>

<div class="deck-header">
  <span><strong>TOOLBX</strong> &middot; Market Pulse</span>
  <span id="deck-date"></span>
</div>

<div class="slide">
  <div class="slide-header">
    <div>
      <div class="slide-eyebrow">Weekly Overview</div>
      <div class="slide-title-row"><span class="yellow-bar"></span><h2 class="slide-title">Market Pulse</h2></div>
    </div>
    <div class="slide-stamp" id="week-stamp"></div>
  </div>
  <div class="slide-body">
    <div class="key-metrics-strip">
      <div class="key-metric-cell"><div class="lbl">Tracked</div><div class="val" id="km-tracked"></div><div class="sub" id="km-tracked-sub"></div></div>
      <div class="key-metric-cell"><div class="lbl">Activity</div><div class="val" id="km-activity"></div><div class="sub" id="km-activity-sub"></div></div>
      <div class="key-metric-cell"><div class="lbl">Losses</div><div class="val" id="km-losses"></div><div class="sub" id="km-losses-sub"></div></div>
      <div class="key-metric-cell"><div class="lbl">New Entrants</div><div class="val" id="km-entrants"></div><div class="sub" id="km-entrants-sub"></div></div>
    </div>

    <div class="intel-grid">
      <div class="intel-col">
        <h3>Competitor Activity</h3>
        <div id="activity"></div>
        <div class="section-label" style="margin-top:14px">Competitive Losses</div>
        <div id="losses"></div>
      </div>
      <div class="intel-col">
        <h3>What We're Hearing</h3>
        <div id="hearing"></div>
      </div>
    </div>
  </div>
  <div class="slide-footer"><span class="brand">TOOLBX&trade;</span><span>Source: Web Research &middot; HubSpot &middot; Gong</span></div>
</div>

<script>
try {
  var _nextMon = function(d) {
    var dow = d.getDay();
    var off = dow === 1 ? 0 : ((1 - dow + 7) % 7);
    var r = new Date(d.getFullYear(), d.getMonth(), d.getDate() + off);
    r.setHours(0,0,0,0);
    return r;
  };
  var _fmt = function(d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
  var now = new Date(Date.now() - 86400000);
  var mon = _nextMon(now);
  var wkStart = new Date(mon.getTime() - 7 * 86400000);
  var wkEnd = new Date(mon.getTime() - 1000);
  document.getElementById('deck-date').textContent = _fmt(wkStart) + ' — ' + _fmt(wkEnd);
  var sy = new Date(mon.getFullYear(), 0, 1);
  var wn = Math.ceil(((mon - sy) / 86400000 + sy.getDay() + 1) / 7);
  document.getElementById('week-stamp').textContent = 'W' + wn;
} catch(e) {
  try { document.getElementById('deck-date').textContent = ''; } catch(e2) {}
}
</script>

<script>
var ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s) { return s == null ? '' : String(s).replace(/[&<>"']/g, function(c){return ESC[c];}); }

/* ======================================================
   DATA
   ====================================================== */

var DATA = {
  tracked: 20,
  threatBreakdown: '5 high · 10 medium · 5 low',
  news: [
    { name: 'Unilog', threat: 'medium', text: 'Won 8/10 gold medals in 2026 Paradigm B2B Combine -- top marks in AI, content management, and sales enablement', src: 'EIN Presswire, Jul 21', url: 'https://www.einnews.com/pr_news/928312923/unilog-wins-eight-gold-medals-in-2026-paradigm-b2b-combine' }
  ],
  entrants: [],
  losses: [],
  themes: [
    { label: 'Competitive Mentions', items: [
      { title: 'Big-Box Pressure', text: 'HD/Lowe\'s pro apps setting contractor expectations dealers feel they must match', who: '10 accounts incl. Smick, Stockham, Tague, R.P. Lumber', url: 'https://us-43298.app.gong.io/call?id=5696443663530162994' },
      { title: 'Epicor Lock-in', text: 'Dealers compare us against Epicor\'s own e-commerce; changing API fees create friction', who: '8 accounts incl. TAL, Tague, R.P. Lumber, Franklin', url: 'https://app.gong.io/call?id=7634502219134060654' }
    ]},
    { label: 'Feature Gaps', items: [
      { title: 'Blueprint-to-Order', text: 'Contractors send plans not lists -- need takeoff tool. HD already has one', who: 'Ganahl, Franklin, TAL', url: 'https://app.gong.io/call?id=1288530892711481686' },
      { title: 'Mobile App', text: 'Job-site ordering on phones -- current ERP portals aren\'t mobile-friendly', who: 'TAL, Kansas Lumber, Bliffert', url: 'https://app.gong.io/call?id=7634502219134060654' }
    ]},
    { label: 'Pain Points', items: [
      { title: 'ERP Integration', text: 'Syncing catalogs/pricing/customers takes weeks and delays launches', who: '10 accounts incl. R.P. Lumber, Franklin, TAL, Tague', url: 'https://app.gong.io/call?id=8763242451987280498' },
      { title: 'AR Collection', text: '80% of customers require payment chasing; teams track on sticky notes', who: 'Dewitt, Tibbetts, Espy, Kansas, Stockham', url: null }
    ]}
  ]
};

/* ======================================================
   RENDER
   ====================================================== */

function renderMetrics() {
  document.getElementById('km-tracked').textContent = String(DATA.tracked);
  document.getElementById('km-tracked-sub').textContent = DATA.threatBreakdown;

  var actCount = DATA.news.length + DATA.entrants.length;
  document.getElementById('km-activity').textContent = String(actCount);
  document.getElementById('km-activity-sub').textContent = actCount > 0 ? 'this week' : 'quiet week';

  document.getElementById('km-losses').textContent = String(DATA.losses.length);
  document.getElementById('km-losses-sub').textContent = DATA.losses.length > 0 ? 'this week' : 'this week';

  document.getElementById('km-entrants').textContent = String(DATA.entrants.length);
  document.getElementById('km-entrants-sub').textContent = DATA.entrants.length > 0 ? DATA.entrants[0].name : 'this week';
}

function renderActivity() {
  var el = document.getElementById('activity');
  if (!DATA.news.length && !DATA.entrants.length) {
    el.innerHTML = '<div class="empty-state">Quiet week across ' + DATA.tracked + ' battlecards</div>';
    return;
  }
  var h = '';
  for (var i = 0; i < DATA.news.length; i++) {
    var n = DATA.news[i];
    h += '<div class="news-card' + (n.threat === 'high' ? ' high' : '') + '">';
    h += '<div class="news-card-head"><span class="news-card-name">' + esc(n.name) + '</span>';
    h += '<span class="threat-pill ' + esc(n.threat) + '">' + esc(n.threat) + '</span></div>';
    h += '<div class="news-card-body">' + esc(n.text) + '</div>';
    if (n.url) {
      h += '<div class="news-card-src"><a href="' + esc(n.url) + '" target="_blank">' + esc(n.src) + '</a></div>';
    } else if (n.src) {
      h += '<div class="news-card-src">' + esc(n.src) + '</div>';
    }
    h += '</div>';
  }
  for (var j = 0; j < DATA.entrants.length; j++) {
    var e = DATA.entrants[j];
    h += '<div class="entrant-chip"><div class="entrant-chip-head">' + esc(e.name) + '<span class="new-tag">New</span></div>';
    h += '<div class="entrant-chip-body">' + esc(e.text) + '</div></div>';
  }
  el.innerHTML = h;
}

function renderLosses() {
  var el = document.getElementById('losses');
  if (!DATA.losses.length) {
    el.innerHTML = '<div class="empty-state">No competitive losses this week</div>';
    return;
  }
  var h = '';
  for (var i = 0; i < DATA.losses.length; i++) {
    var d = DATA.losses[i];
    h += '<div class="loss-chip"><div class="loss-chip-name">' + esc(d.name) + '</div>';
    if (d.arr) h += '<div class="loss-chip-meta"><span class="loss-chip-arr">$' + Math.round(d.arr / 1000) + 'k</span> ARR</div>';
    if (d.detail) h += '<div class="loss-chip-detail">' + esc(d.detail) + '</div>';
    if (d.competitor) h += '<span class="competitor-tag">vs ' + esc(d.competitor) + '</span>';
    h += '</div>';
  }
  el.innerHTML = h;
}

function renderHearing() {
  var el = document.getElementById('hearing');
  var h = '';
  for (var t = 0; t < DATA.themes.length; t++) {
    var theme = DATA.themes[t];
    h += '<div class="theme-block"><h4>' + esc(theme.label) + '</h4>';
    for (var i = 0; i < theme.items.length; i++) {
      var it = theme.items[i];
      h += '<div class="theme-item">';
      h += '<div class="theme-item-title">' + esc(it.title) + '</div>';
      h += '<div class="theme-item-text">' + esc(it.text) + '</div>';
      h += '<div class="theme-item-meta">' + esc(it.who);
      if (it.url) h += ' · <a href="' + esc(it.url) + '" target="_blank">Recording</a>';
      h += '</div></div>';
    }
    h += '</div>';
  }
  h += '<div class="data-note">Themes ranked by frequency across accounts · Gong Mar–Jul 2026</div>';
  el.innerHTML = h;
}

renderMetrics();
renderActivity();
renderLosses();
renderHearing();
</script>
