<title>Market Pulse</title>
<style>
  :root {
    color-scheme: light;
    --slate-black: #1C1C1E; --dark-grey: #494949; --silver-grey: #CCCCCC;
    --light-grey: #F2F2F2; --white: #FFFFFF;
    --sunrise-yellow: #FFCA05; --won-bg: #FFF8E1;
    --metallic-seaweed: #457F86; --lost-red: #B91C1C;
    --teal: #1C8DA1; --teal-lt: #93C1C8;
  }
  * { box-sizing: border-box; }
  body { font-family: "DM Sans", Calibri, Arial, sans-serif; background: #e6e7eb; color: var(--slate-black); margin: 0; padding: 24px 16px; font-size: 14px; line-height: 1.45; }

  .deck-header { max-width: 1080px; margin: 0 auto 18px; display: flex; justify-content: space-between; align-items: center; color: var(--dark-grey); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; padding: 0 4px; }
  .deck-header strong { color: var(--slate-black); }

  .slide { max-width: 1080px; margin: 0 auto 20px; background: var(--white); border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06); position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .slide-header { padding: 22px 36px 8px; display: flex; justify-content: space-between; align-items: flex-start; flex-shrink: 0; }
  .slide-eyebrow { color: var(--silver-grey); font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; margin-bottom: 4px; }
  .slide-title-row { display: flex; align-items: center; gap: 12px; }
  .yellow-bar { display: inline-block; width: 6px; height: 30px; background: var(--sunrise-yellow); flex-shrink: 0; }
  .slide-title { font-family: Georgia, "Bitter", serif; font-size: 22px; font-weight: 700; color: var(--slate-black); letter-spacing: -0.01em; margin: 0; line-height: 1.15; }
  .slide-stamp { font-family: Georgia, "Bitter", serif; font-weight: 700; color: var(--silver-grey); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; }

  .slide-body { padding: 14px 28px 18px; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .slide-footer { padding: 10px 36px 14px; display: flex; justify-content: space-between; align-items: center; color: var(--dark-grey); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; border-top: 1px solid var(--light-grey); flex-shrink: 0; }
  .slide-footer .brand { font-family: Georgia, "Bitter", serif; color: var(--slate-black); font-weight: 700; }

  .intel-section { margin-bottom: 14px; }
  .intel-section h3 { margin: 0 0 10px; font-size: 12px; color: var(--slate-black); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 14px; border-left: 4px solid var(--sunrise-yellow); background: linear-gradient(90deg, rgba(28,141,161,0.07) 0%, transparent 60%); border-radius: 0 2px 2px 0; }

  .news-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .news-card { background: var(--light-grey); padding: 8px 12px; border-radius: 2px; border-left: 3px solid var(--sunrise-yellow); flex: 1; min-width: 220px; }
  .news-card.high { border-left-color: var(--lost-red); }
  .news-card-head { display: flex; align-items: center; gap: 6px; }
  .news-card-name { font-weight: 700; font-size: 11.5px; }
  .threat-pill { display: inline-block; font-size: 7.5px; padding: 1px 6px; border-radius: 999px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .threat-pill.high { background: var(--lost-red); color: var(--white); }
  .threat-pill.medium { background: var(--sunrise-yellow); color: var(--slate-black); }
  .news-card-body { font-size: 10.5px; color: var(--dark-grey); margin-top: 3px; line-height: 1.35; }
  .news-card-src { font-size: 8.5px; color: var(--silver-grey); margin-top: 3px; }
  .news-card-src a { color: var(--teal); text-decoration: none; font-weight: 600; }
  .news-card-src a:hover { text-decoration: underline; }

  .hearing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .hearing-grid { grid-template-columns: 1fr; } }
  #hearing-full { margin-top: 10px; }

  .theme-block { background: var(--light-grey); padding: 8px 12px; border-radius: 2px; border-left: 3px solid var(--teal); }
  .theme-block h4 { margin: 0 0 5px; font-size: 10px; font-weight: 700; color: var(--teal); text-transform: uppercase; letter-spacing: 0.04em; }
  .theme-item { margin-bottom: 6px; }
  .theme-item:last-child { margin-bottom: 0; }
  .theme-item-title { font-weight: 700; font-size: 11px; color: var(--slate-black); }
  .theme-item-text { font-size: 10px; color: var(--dark-grey); line-height: 1.35; }
  .theme-item-meta { font-size: 9px; color: var(--silver-grey); margin-top: 2px; }

  .empty-state { background: var(--light-grey); border-radius: 2px; padding: 6px 12px; font-size: 10px; color: var(--silver-grey); border-left: 3px solid var(--light-grey); }
  .data-note { font-size: 8.5px; color: var(--silver-grey); margin-top: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }

  .team-pill { display: inline-block; font-size: 7px; padding: 1px 5px; border-radius: 999px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-left: 3px; vertical-align: middle; }
  .team-pill.growth { background: var(--teal); color: var(--white); }
  .team-pill.onboarding { background: var(--sunrise-yellow); color: var(--slate-black); }
  .team-pill.acct-mgmt { background: var(--metallic-seaweed); color: var(--white); }

  .section-icon { width: 22px; height: 22px; vertical-align: -5px; margin-right: 8px; }
  .source-link { color: var(--teal); text-decoration: none; font-weight: 600; }
  .source-link:hover { text-decoration: underline; }
</style>

<div class="deck-header">
  <span><strong>TOOLBX</strong> &middot; Market Pulse</span>
  <span id="deck-date"></span>
</div>

<div class="slide">
  <div class="slide-header">
    <div>
      <div class="slide-eyebrow">Weekly Overview</div>
      <div class="slide-title-row"><span class="yellow-bar"></span><h2 class="slide-title">Market Pulse</h2></div>
    </div>
    <div class="slide-stamp" id="week-stamp"></div>
  </div>
  <div class="slide-body">
    <div class="intel-section">
      <h3><svg class="section-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" stroke="#1C8DA1" stroke-width="2"/><circle cx="12" cy="12" r="5" stroke="#1C8DA1" stroke-width="1.5"/><circle cx="12" cy="12" r="1.5" fill="#FFCA05"/><line x1="12" y1="1" x2="12" y2="5" stroke="#1C8DA1" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="19" x2="12" y2="23" stroke="#1C8DA1" stroke-width="1.5" stroke-linecap="round"/><line x1="1" y1="12" x2="5" y2="12" stroke="#1C8DA1" stroke-width="1.5" stroke-linecap="round"/><line x1="19" y1="12" x2="23" y2="12" stroke="#1C8DA1" stroke-width="1.5" stroke-linecap="round"/></svg>Competitor Activity</h3>
      <div class="news-row" id="activity-news"></div>
    </div>

    <div class="intel-section">
      <h3><svg class="section-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 18V12a9 9 0 0 1 18 0v6" stroke="#1C8DA1" stroke-width="2.5" stroke-linecap="round"/><rect x="1" y="14" width="4" height="7" rx="2" fill="#FFCA05"/><rect x="19" y="14" width="4" height="7" rx="2" fill="#FFCA05"/><path d="M8.5 10.5a3.5 3.5 0 0 1 7 0" stroke="#1C8DA1" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/></svg>What We're Hearing</h3>
      <div class="hearing-grid">
        <div id="hearing-left"></div>
        <div id="hearing-right"></div>
      </div>
      <div id="hearing-full"></div>
      <div class="data-note">Themes from Gong calls &middot; Last 7 days &middot; Andrews Ace, Hackensack, IWP, RoMac, Sound Hardware, Standard Building, Yates</div>
    </div>
  </div>
  <div class="slide-footer"><span class="brand">TOOLBX&trade;</span><span>Source: Web Research &middot; Gong</span></div>
</div>

<script>
try {
  var _nextMon = function(d) {
    var dow = d.getDay();
    var off = dow === 1 ? 0 : ((1 - dow + 7) % 7);
    var r = new Date(d.getFullYear(), d.getMonth(), d.getDate() + off);
    r.setHours(0,0,0,0);
    return r;
  };
  var _fmt = function(d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
  var now = new Date(Date.now() - 86400000);
  var mon = _nextMon(now);
  var wkStart = new Date(mon.getTime() - 7 * 86400000);
  var wkEnd = new Date(mon.getTime() - 1000);
  document.getElementById('deck-date').textContent = _fmt(wkStart) + ' — ' + _fmt(wkEnd);
  var sy = new Date(mon.getFullYear(), 0, 1);
  var wn = Math.ceil(((mon - sy) / 86400000 + sy.getDay() + 1) / 7);
  document.getElementById('week-stamp').textContent = 'W' + wn;
} catch(e) {
  try { document.getElementById('deck-date').textContent = ''; } catch(e2) {}
}
</script>

<script>
var ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
function esc(s) { return s == null ? '' : String(s).replace(/[&<>"']/g, function(c){return ESC[c];}); }

var DATA = {
  news: [
    { name: 'Epicor', threat: 'high', text: 'Launched Propello, a cloud POS/e-commerce/loyalty platform, via a new partnership with buying co-op Do it Best (~$6B in annual sales) — a direct customer-facing commerce play in the exact hardware/lumber channel Toolbx serves, and a continuation of the AI-agent + new-CEO momentum flagged the last two weeks', src: 'Red Book Lumber Data, Aug 21', url: 'https://www.redbooklumberdata.com/2026/08/21/do-it-best-group-announces-new-technology-services-partnership-with-epicor/' },
    { name: 'Unilog', threat: 'high', text: 'Launched CX1 Sigma, an "AI-native" B2B commerce platform combining storefront, PIM/content, and an AI agent suite for demand-gen and account expansion, plus a "Site Studio" that auto-builds pages from plain-language prompts — direct overlap with Toolbx\'s catalog/ordering/AI territory', src: 'MDM, Aug 20', url: 'https://www.mdm.com/news/technology/technology-provider-news/unilog-launches-b2b-commerce-platform-for-distributors/' },
    { name: 'Rundoo', threat: 'medium', text: 'Raised a $30M Series B (Battery Ventures-led, $48M total) for its AI-first quoting/ordering/inventory platform serving 500+ independent hardware, paint, farm & feed, and lumber stores — very likely the same competitor Blue Spruce has referenced under two different misspellings ("Rondu"/"Rondue") the past two weeks, now resolved', src: 'Morningstar/Business Wire, Aug 19', url: 'https://www.morningstar.com/news/business-wire/20260819537737/rundoo-the-ai-first-platform-for-independent-supply-stores-announces-48-million-in-financing' }
  ],
  themes: [
    { label: 'Feature Gaps', items: [
      { title: 'Builder/GC Portal Integration', text: 'No way to pull purchase orders directly from major builder portals (e.g. DR Horton, SupplyPro) to auto-create orders — confirmed as a flat gap today, not a config option: "None of those as of right now, no."', sources: [
        { name: 'RoMac', team: 'growth', url: 'https://app.gong.io/call?id=7839331121698897082' }
      ]},
      { title: 'BOGO / Bundle Promotions', text: 'Can\'t run manufacturer bundle promos (e.g. buy-a-tool-get-a-free-battery) on the catalog today — confirmed directly: "That is not something we support right now"', sources: [
        { name: 'Yates', team: 'onboarding', url: 'https://app.gong.io/call?id=5766060408307944795' }
      ]},
      { title: 'Reverse Tally for Random-Length Lumber', text: 'Tally tool only works one direction (lengths to total); can\'t take a target linear footage and calculate the board-length mix needed, unlike a tool this customer used previously', sources: [
        { name: 'IWP', team: 'growth', url: 'https://app.gong.io/call?id=5947784821552041420' }
      ]}
    ]},
    { label: 'Pain Points', items: [
      { title: 'ACH Whitelisting Banking Friction', text: 'Toolbx\'s ACH setup is forcing this account to open a brand-new dedicated bank account and route it through corporate\'s full check-signing chain just to get set up', sources: [
        { name: 'Yates', team: 'onboarding', url: 'https://app.gong.io/call?id=5766060408307944795' }
      ]},
      { title: 'Manual Permit Lead Workflow', text: 'Leads assigned via a weekly meeting and Excel ("green sheets"); a separate self-built permit-tracking app runs completely siloed from their ERP/CRM', sources: [
        { name: 'Standard Building', team: 'growth', url: 'https://app.gong.io/call?id=7537040341363562659' }
      ]},
      { title: 'Franchisor Brand/Domain Control Tension', text: 'Ace Hardware corporate is pushing back on keeping "ace" out of this dealer\'s e-commerce domain name; customer calls losing it a "deal breaker" consideration', sources: [
        { name: 'Andrews Ace', team: 'onboarding', url: 'https://app.gong.io/call?id=5718354738423911884' }
      ]}

    { label: 'Competitive Landscape', items: [
      { title: 'Epicor Propello via Do it Best', text: 'Toolbx\'s own rep raised Do it Best\'s new Epicor Propello partnership live on a call — no visibility yet into any customer actually using it', sources: [
        { name: 'Hackensack', team: 'growth', url: 'https://app.gong.io/call?id=3518398876380056449' }

};

function renderActivity() {
  var newsEl = document.getElementById('activity-news');
  var h = '';
  if (DATA.news.length === 0) {
    h = '<div class="empty-state">No competitor activity this week</div>';
  } else {
    for (var i = 0; i < DATA.news.length; i++) {
      var n = DATA.news[i];
      h += '<div class="news-card' + (n.threat === 'high' ? ' high' : '') + '">';
      h += '<div class="news-card-head"><span class="news-card-name">' + esc(n.name) + '</span>';
      h += '<span class="threat-pill ' + esc(n.threat) + '">' + esc(n.threat) + '</span></div>';
      h += '<div class="news-card-body">' + esc(n.text) + '</div>';
      if (n.url) {
        h += '<div class="news-card-src"><a class="source-link" href="' + esc(n.url) + '" rel="noopener noreferrer" onclick="window.open(this.href);return false;">' + esc(n.src) + ' &#x2197;</a></div>';
      } else if (n.src) {
        h += '<div class="news-card-src">' + esc(n.src) + '</div>';
      }
      h += '</div>';
    }
  }
  newsEl.innerHTML = h;
}

var TEAM_LABELS = { 'growth': 'Growth', 'onboarding': 'Onboarding', 'acct-mgmt': 'Account Mgmt' };

function renderThemeBlock(theme) {
  var h = '<div class="theme-block"><h4>' + esc(theme.label) + '</h4>';
  for (var i = 0; i < theme.items.length; i++) {
    var it = theme.items[i];
    h += '<div class="theme-item">';
    h += '<div class="theme-item-title">' + esc(it.title) + '</div>';
    h += '<div class="theme-item-text">' + esc(it.text) + '</div>';
    h += '<div class="theme-item-meta">';
    if (it.sources) {
      var names = '';
      var pills = '';
      var seenTeams = {};
      for (var s = 0; s < it.sources.length; s++) {
        if (s > 0) names += ' &middot; ';
        var src = it.sources[s];
        if (src.url) {
          names += '<a class="source-link" href="' + esc(src.url) + '" rel="noopener noreferrer" onclick="window.open(this.href);return false;">' + esc(src.name) + ' &#x2197;</a>';
        } else {
          names += esc(src.name);
        }
        if (src.team && !seenTeams[src.team]) {
          seenTeams[src.team] = true;
          pills += '<span class="team-pill ' + esc(src.team) + '">' + esc(TEAM_LABELS[src.team] || src.team) + '</span>';
        }
      }
      h += names + pills;
    }
    h += '</div>';
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function renderHearing() {
  var leftEl = document.getElementById('hearing-left');
  var rightEl = document.getElementById('hearing-right');
  var fullEl = document.getElementById('hearing-full');
  var lh = '';
  var rh = '';
  var fh = '';
  if (DATA.themes.length > 0) {
    lh = renderThemeBlock(DATA.themes[0]);
  }
  if (DATA.themes.length > 1) {
    rh = renderThemeBlock(DATA.themes[1]);
  }
  if (DATA.themes.length > 2) {
    fh = renderThemeBlock(DATA.themes[2]);
  }
  leftEl.innerHTML = lh;
  rightEl.innerHTML = rh;
  fullEl.innerHTML = fh;
}

renderActivity();
renderHearing();
</script>
