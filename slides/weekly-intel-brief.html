<title>Market Pulse</title>
<style>

    color-scheme: light;

    --teal: #1C8DA1; --teal-lt: #93C1C8;

  .deck-header strong { color: var(--slate-black); }

  .slide { max-width: 1080px; margin: 0 auto 20px; background: var(--white); border-radius: 4px; box-shadow: 0 4px 16px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06); position: relative; overflow: hidden; display: flex; flex-direction: column; }
  .slide-header { padding: 22px 36px 8px; display: flex; justify-content: space-between; align-items: flex-start; flex-shrink: 0; }

  .slide-title-row { display: flex; align-items: center; gap: 12px; }
  .yellow-bar { display: inline-block; width: 6px; height: 30px; background: var(--sunrise-yellow); flex-shrink: 0; }
  .slide-title { font-family: Georgia, "Bitter", serif; font-size: 22px; font-weight: 700; color: var(--slate-black); letter-spacing: -0.01em; margin: 0; line-height: 1.15; }
  .slide-stamp { font-family: Georgia, "Bitter", serif; font-weight: 700; color: var(--silver-grey); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; }

  .slide-body { padding: 14px 28px 18px; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .slide-footer { padding: 10px 36px 14px; display: flex; justify-content: space-between; align-items: center; color: var(--dark-grey); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; border-top: 1px solid var(--light-grey); flex-shrink: 0; }
  .slide-footer .brand { font-family: Georgia, "Bitter", serif; color: var(--slate-black); font-weight: 700; }

  .intel-section { margin-bottom: 14px; }
  .intel-section h3 { margin: 0 0 10px; font-size: 12px; color: var(--slate-black); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 14px; border-left: 4px solid var(--sunrise-yellow); background: linear-gradient(90deg, rgba(28,141,161,0.07) 0%, transparent 60%); border-radius: 0 2px 2px 0; }

  .news-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .news-card { background: var(--light-grey); padding: 8px 12px; border-radius: 2px; border-left: 3px solid var(--sunrise-yellow); flex: 1; min-width: 220px; }
  .news-card.high { border-left-color: var(--lost-red); }
  .news-card-head { display: flex; align-items: center; gap: 6px; }
  .news-card-name { font-weight: 700; font-size: 11.5px; }

  .trend-badge { display: inline-block; font-size: 7.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 5px; border-radius: 2px; margin-left: 6px; vertical-align: middle; position: relative; top: -1px; }

  .cite-detail { font-size: 9px; color: var(--silver-grey); margin-top: 3px; line-height: 1.3; }
  .cite-detail-label { font-size: 7.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--silver-grey); }

  .trend-table { display: flex; flex-direction: column; gap: 4px; }
  .trend-row { display: flex; align-items: flex-start; gap: 10px; padding: 6px 10px; background: var(--light-grey); border-radius: 2px; }
  .trend-arrow { width: 18px; font-size: 14px; font-weight: 700; flex-shrink: 0; text-align: center; line-height: 1.3; }

  .trend-arrow.stable { color: var(--silver-grey); }
  .trend-arrow.fading { color: var(--silver-grey); opacity: 0.5; }
  .trend-arrow.new { color: var(--teal); }

  .trend-body { flex: 1; min-width: 0; }
  .trend-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .trend-title { font-weight: 700; font-size: 11px; color: var(--slate-black); }
  .trend-sparkline { flex-shrink: 0; }
  .trend-meta { font-size: 9px; color: var(--silver-grey); font-weight: 600; }
  .trend-segment { font-size: 9px; color: var(--silver-grey); font-style: italic; margin-top: 1px; }

  .graduated-header { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--silver-grey); margin-bottom: 6px; }
  .graduated-item { display: flex; align-items: center; gap: 8px; font-size: 10px; color: var(--dark-grey); padding: 3px 0; }
  .graduated-item + .graduated-item { border-top: 1px solid rgba(0,0,0,0.04); }
  .graduated-title { font-weight: 600; }
  .status-tag { display: inline-block; font-size: 7px; padding: 1px 5px; border-radius: 2px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .status-tag.escalated { background: rgba(185,28,28,0.12); color: var(--lost-red); }
  .status-tag.tracked { background: rgba(28,141,161,0.12); color: var(--teal); }
  .status-tag.monitoring { background: rgba(0,0,0,0.06); color: var(--silver-grey); }
  .graduated-meta { font-size: 8.5px; color: var(--silver-grey); }

  .empty-state { background: var(--light-grey); border-radius: 2px; padding: 6px 12px; font-size: 10px; color: var(--silver-grey); }
  .data-note { font-size: 8.5px; color: var(--silver-grey); margin-top: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }

  .bottom-line { margin: 0; padding: 8px 14px; font-size: 11px; font-weight: 600; color: var(--slate-black); line-height: 1.4; border-left: 4px solid var(--sunrise-yellow); background: var(--won-bg); border-radius: 0 2px 2px 0; }

  .source-link { color: var(--teal); text-decoration: none; font-weight: 600; }
  .source-link:hover { text-decoration: underline; }

<script>
try {
  var _nextMon = function(d) {
    var dow = d.getDay();
    var off = dow === 1 ? 0 : ((1 - dow + 7) % 7);
    var r = new Date(d.getFullYear(), d.getMonth(), d.getDate() + off);
    r.setHours(0,0,0,0);
    return r;
  };
  var _fmt = function(d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); };
  var now = new Date(Date.now() - 86400000);
  var mon = _nextMon(now);
  var wkStart = new Date(mon.getTime() - 7 * 86400000);
  var wkEnd = new Date(mon.getTime() - 1000);
  document.getElementById('deck-date').textContent = _fmt(wkStart) + ' — ' + _fmt(wkEnd);
  var sy = new Date(mon.getFullYear(), 0, 1);
  var wn = Math.ceil(((mon - sy) / 86400000 + sy.getDay() + 1) / 7);
  document.getElementById('week-stamp').textContent = 'W' + wn;
} catch(e) {
  try { document.getElementById('deck-date').textContent = ''; } catch(e2) {}
}
</script>

function renderBottomLine() {
  var el = document.getElementById('bottom-line');
  if (DATA.keySignal) {
    el.innerHTML = '<div class="bottom-line"><strong>Key signal:</strong> ' + esc(DATA.keySignal) + '</div>';
  }
}

function renderActivity() {
  var newsEl = document.getElementById('activity-news');
  var h = '';
  var hasNews = DATA.news && DATA.news.length > 0;
  if (!hasNews) {
    h = '<div class="empty-state">No competitor activity this week</div>';
  } else {
    for (var i = 0; i < DATA.news.length; i++) {
      var n = DATA.news[i];
      h += '<div class="news-card' + (n.threat === 'high' ? ' high' : '') + '">';
      h += '<div class="news-card-head"><span class="news-card-name">' + esc(n.name) + '</span>';
      h += '<span class="threat-pill ' + esc(n.threat) + '">' + esc(n.threat) + '</span></div>';
      h += '<div class="news-card-body">' + esc(n.text) + '</div>';
      if (n.url) {
        h += '<div class="news-card-src"><a class="source-link" href="' + esc(n.url) + '" rel="noopener noreferrer" onclick="window.open(this.href);return false;">' + esc(n.src) + ' &#x2197;</a></div>';
      } else if (n.src) {
        h += '<div class="news-card-src">' + esc(n.src) + '</div>';
      }
      h += '</div>';
    }
  }
  newsEl.innerHTML = h;
}

function renderBlockers() {
  var el = document.getElementById('blocker-list');
  var h = '';
  if (!DATA.blockers || DATA.blockers.length === 0) {
    h = '<div class="empty-state">No blocking themes this week</div>';
    el.innerHTML = h;
    return;
  }
  for (var i = 0; i < DATA.blockers.length; i++) {
    var b = DATA.blockers[i];
    var pillClass = b.type === 'gap' ? 'gap' : (b.type === 'pain' ? 'pain' : 'objection');
    var pillLabel = b.type === 'gap' ? 'GAP' : (b.type === 'pain' ? 'PAIN' : 'OBJECTION');
    var isRecurring = b.trend && b.trend.weeksActive > 1;
    h += '<div class="blocker-item">';
    h += '<div class="blocker-item-header">';
    h += '<span class="type-pill ' + pillClass + '">' + pillLabel + '</span>';
    h += '<span class="blocker-item-title">' + esc(b.title);
    if (isRecurring) {
      h += ' <span class="trend-badge recurring">' + b.trend.weeksActive + 'w recurring</span>';
    }
    h += '</span>';
    h += '</div>';
    if (b.summary) {
      h += '<div class="blocker-item-summary">' + esc(b.summary) + '</div>';
    }
    if (b.citedBy && b.citedBy.length > 0) {
      var cites = [];
      for (var c = 0; c < b.citedBy.length; c++) {
        var cb = b.citedBy[c];
        var detail = esc(cb.company);
        if (cb.tier || cb.stage) {
          var parts = [];
          if (cb.tier) parts.push(cb.tier);
          if (cb.stage) parts.push(cb.stage);
          detail += ' <span style="color:var(--silver-grey);font-size:8px;">(' + esc(parts.join(', ')) + ')</span>';
        }
        cites.push(detail);
      }
      h += '<div class="cite-detail"><span class="cite-detail-label">Cited by: </span>' + cites.join('; ') + '</div>';
    }
    h += '</div>';
  }
  el.innerHTML = h;
}

function renderSparkline(weeklyMentions) {
  var maxM = Math.max.apply(null, weeklyMentions.concat([1]));
  var bars = [];
  for (var i = 0; i < weeklyMentions.length; i++) {
    var h = weeklyMentions[i] > 0 ? Math.max(4, Math.round((weeklyMentions[i] / maxM) * 14)) : 3;
    var fill = weeklyMentions[i] > 0 ? 'var(--teal)' : 'var(--silver-grey)';
    var opacity = weeklyMentions[i] > 0 ? '1' : '0.3';
    var x = i * 6;
    var y = 14 - h;
    bars.push('<rect x="' + x + '" y="' + y + '" width="4" height="' + h + '" rx="1" fill="' + fill + '" opacity="' + opacity + '"/>');
  }
  var w = weeklyMentions.length * 6;
  return '<svg width="' + w + '" height="14" viewBox="0 0 ' + w + ' 14" class="trend-sparkline">' + bars.join('') + '</svg>';
}

function renderTrendIntel() {
  var el = document.getElementById('trend-intel');
  if (!DATA.trendIntel || !DATA.trendIntel.themes || DATA.trendIntel.themes.length === 0) return;

  var ti = DATA.trendIntel;
  var h = '<div class="intel-section">';
  h += '<h3>Trend Intelligence &middot; ' + esc(ti.quarterLabel) + ' &middot; ' + ti.windowWeeks + '-Week View</h3>';
  h += '<div class="trend-table">';

  for (var i = 0; i < ti.themes.length; i++) {
    var t = ti.themes[i];
    h += '<div class="trend-row">';
    h += '<div class="trend-arrow ' + esc(t.direction) + '">' + (ARROWS[t.direction] || '') + '</div>';
    h += '<div class="trend-body">';
    h += '<div class="trend-title-row">';
    h += '<span class="trend-title">' + esc(t.displayTitle) + '</span>';
    h += renderSparkline(t.weeklyMentions);
    h += '<span class="trend-meta">' + t.weeksActive + 'w active &middot; ' + t.uniqueCompanies + ' account' + (t.uniqueCompanies !== 1 ? 's' : '') + '</span>';
    h += '</div>';
    if (t.segmentation) {
      h += '<div class="trend-segment">' + esc(t.segmentation) + '</div>';
    }
    h += '</div></div>';
  }

  h += '</div></div>';
  el.innerHTML = h;
}

    var meta = [];
    if (g.weeksActive) meta.push(g.weeksActive + 'w');
    if (g.owner) meta.push(g.owner);
    if (g.since) meta.push('since ' + g.since);
    if (meta.length > 0) {
      h += '<span class="graduated-meta">' + esc(meta.join(' · ')) + '</span>';
    }
    h += '</div>';
  }
  h += '</div>';
  el.innerHTML = h;
}

function renderDataNote() {
  var el = document.getElementById('data-note');
  var seen = {};
  var companies = [];
  if (DATA.blockers) {
    for (var i = 0; i < DATA.blockers.length; i++) {
      var cb = DATA.blockers[i].citedBy;
      if (cb) {
        for (var c = 0; c < cb.length; c++) {
          if (!seen[cb[c].company]) {
            seen[cb[c].company] = true;
            companies.push(cb[c].company);
          }
        }
      }
    }
  }
  var parts = ['Themes from Gong calls'];
  if (DATA.window) {
    var ws = DATA.window.start.replace(/-/g, '/');
    var we = DATA.window.end.replace(/-/g, '/');
    var s = new Date(ws);
    var e = new Date(we);
    var fmtShort = function(d) { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
    parts.push('Rolling ' + DATA.window.weeksIncluded + ' weeks (' + fmtShort(s) + ' – ' + fmtShort(e) + ')');
  }
  if (DATA.meta && DATA.meta.activeDealCount != null) {
    parts.push(DATA.meta.activeDealCount + ' of ' + DATA.meta.totalDealCount + ' deals active');
  }
  if (companies.length > 0) {
    parts.push(companies.join(', '));
  }
  el.innerHTML = parts.join(' &middot; ');
}

renderActivity();
renderBlockers();
renderTrendIntel();
renderWhatsLanding();
renderGraduated();
renderDataNote();
renderBottomLine();
</script>
