name: Setup ICP Properties (run once)

on:
  workflow_dispatch:

jobs:
  setup:
    name: Create ICP v3.4 properties in HubSpot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create all missing ICP v3.4 properties via API
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: |
          BASE="https://api.hubapi.com/crm/v3/properties/companies"
          AUTH="Authorization: Bearer $HUBSPOT_ACCESS_TOKEN"
          CT="Content-Type: application/json"

          create_prop() {
            local name="$1" label="$2" type="$3" field="$4"
            local status=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH" "$BASE/$name")
            if [ "$status" = "200" ]; then
              echo "  $name already exists."
            else
              local resp=$(curl -s -X POST "$BASE" -H "$AUTH" -H "$CT" -d "{\"name\":\"$name\",\"label\":\"$label\",\"type\":\"$type\",\"fieldType\":\"$field\",\"groupName\":\"companyinformation\",\"hidden\":false}" )
              echo "  $name: $(echo $resp | python3 -c \"import sys,json; d=json.load(sys.stdin); print(d.get('name','ERROR:'+str(d)))\" 2>/dev/null || echo $resp)"
            fi
          }

          echo "=== Creating numeric sub-score properties ==="
          create_prop "icp_score_revenue"     "ICP Score: Revenue"     "number"      "number"
          create_prop "icp_score_locations"   "ICP Score: Locations"   "number"      "number"
          create_prop "icp_score_association" "ICP Score: Association" "number"      "number"
          create_prop "icp_score_erp"         "ICP Score: ERP"         "number"      "number"

          echo "=== Creating icp_erp_class dropdown ==="
          local status=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH" "$BASE/icp_erp_class")
          if [ "$status" = "200" ]; then
            echo "  icp_erp_class already exists."
          else
            curl -s -X POST "$BASE" -H "$AUTH" -H "$CT" -d '{
              "name": "icp_erp_class",
              "label": "ICP ERP Classification",
              "type": "enumeration",
              "fieldType": "select",
              "groupName": "companyinformation",
              "hidden": false,
              "options": [
                {"label":"Compatible","value":"Compatible","displayOrder":0,"hidden":false},
                {"label":"Non-Compatible","value":"Non-Compatible","displayOrder":1,"hidden":false},
                {"label":"Unknown","value":"Unknown","displayOrder":2,"hidden":false}
              ]
            }' | python3 -c "import sys,json; d=json.load(sys.stdin); print('  Created: ' + d.get('name','ERROR:'+str(d)))"
          fi

          echo "=== Patching icp_tier with v3.4 DQ options ==="
          TIER_RESP=$(curl -s -H "$AUTH" "$BASE/icp_tier")
          echo "$TIER_RESP" | python3 -c "
          import sys, json, subprocess, os
          d = json.load(sys.stdin)
          opts = d.get('options', [])
          values = [o['value'] for o in opts]
          new_opts = list(opts)
          for v, label, order in [
            ('Disqualify - Composite','Disqualify - Composite',3),
            ('Disqualify - Geo Gate','Disqualify - Geo Gate',4),
            ('Disqualify - Vertical Gate','Disqualify - Vertical Gate',5),
          ]:
            if v not in values:
              new_opts.append({'label':label,'value':v,'displayOrder':order,'hidden':False})
          # Hide old Disqualify option
          for o in new_opts:
            if o['value'] == 'Disqualify' and ' - ' not in o['value']:
              o['hidden'] = True
          payload = json.dumps({'options': new_opts})
          token = os.environ['HUBSPOT_ACCESS_TOKEN']
          r = subprocess.run(['curl','-s','-X','PATCH','https://api.hubapi.com/crm/v3/properties/companies/icp_tier',
            '-H','Authorization: Bearer '+token,'-H','Content-Type: application/json','-d',payload],
            capture_output=True, text=True)
          result = json.loads(r.stdout)
          opts_after = [o['value'] for o in result.get('options', []) if not o.get('hidden')]
          print('  icp_tier options now: ' + str(opts_after))
          "

          echo "=== Done ==="
