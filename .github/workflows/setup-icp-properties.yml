name: Setup ICP Properties (run once)

on:
  workflow_dispatch:

jobs:
  setup:
    name: Create ICP v3.4 properties in HubSpot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify token can read properties
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: |
          echo "=== Token scope check ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $HUBSPOT_ACCESS_TOKEN" \
            "https://api.hubapi.com/crm/v3/properties/companies/icp_score_composite")
          echo "GET icp_score_composite -> HTTP $STATUS (404=not found, 403=no permission)"

      - name: Try creating icp_score_composite via curl
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: |
          echo "=== Attempting property creation ==="
          curl -s -X POST "https://api.hubapi.com/crm/v3/properties/companies" \
            -H "Authorization: Bearer $HUBSPOT_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "icp_score_composite",
              "label": "ICP Composite Score",
              "type": "number",
              "fieldType": "number",
              "groupName": "companyinformation",
              "hasUniqueValue": false,
              "hidden": false
            }' | python3 -m json.tool || true

      - name: Run Node.js property setup script
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: |
          set -e
          node scripts/setup-icp-properties.js
