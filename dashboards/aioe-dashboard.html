:root {
  --bg: #F8F8F8; --bg-card: #ffffff; --bg-inset: #EFEFEF; --bg-hover: #F5F5F3;
  --fg: #1C1C1E; --fg2: #494949; --fg3: #737373;
  --border: #E0E0E0; --border-focus: #FFCA05;
  --accent: #FFCA05; --accent-hover: #E5B600; --accent-soft: #FFF8E1; --accent-fg: #7A5C00;
  --good: #0E8A5F; --good-soft: #E8F8F0; --good-fg: #065F46;
  --warn: #C07800; --warn-soft: #FFF6E0; --warn-fg: #7A4D00;
  --bad: #CC3326; --bad-soft: #FDEEEC; --bad-fg: #8B1A10;
  --chart-1: #C99700; --chart-2: #494949; --chart-3: #8B6914;
  --chart-prev: rgba(201,151,0,0.22);
  --radius: 6px; --shadow: 0 1px 2px rgba(28,28,30,0.06);
  --header-bg: #1C1C1E; --header-fg: #F8F8F8; --brand: #FFCA05;
  --hs-accent: #FF7A59;
}
@media (prefers-color-scheme:dark) { :root {
  --bg: #1C1C1E; --bg-card: #2E2E2E; --bg-inset: #252525; --bg-hover: #353535;
  --fg: #F8F8F8; --fg2: #CCCCCC; --fg3: #737373;
  --border: #3D3D3D; --border-focus: #FFCA05;
  --accent: #FFCA05; --accent-hover: #FFD740; --accent-soft: #3D3200; --accent-fg: #FFD740;
  --good: #3FB950; --good-soft: #1A2E1A; --good-fg: #56D364;
  --warn: #D29922; --warn-soft: #2E2210; --warn-fg: #E3B341;
  --bad: #F85149; --bad-soft: #2E1210; --bad-fg: #FF7B72;
  --chart-1: #FFCA05; --chart-2: #FFE082; --chart-3: #B8960A;
  --chart-prev: rgba(255,202,5,0.2);
  --header-bg: #141416; --header-fg: #F8F8F8; --brand: #FFCA05;
  --hs-accent: #FF7A59;
}}
:root[data-theme="dark"] {
  --bg: #1C1C1E; --bg-card: #2E2E2E; --bg-inset: #252525; --bg-hover: #353535;
  --fg: #F8F8F8; --fg2: #CCCCCC; --fg3: #737373;
  --border: #3D3D3D; --border-focus: #FFCA05;
  --accent: #FFCA05; --accent-hover: #FFD740; --accent-soft: #3D3200; --accent-fg: #FFD740;
  --good: #3FB950; --good-soft: #1A2E1A; --good-fg: #56D364;
  --warn: #D29922; --warn-soft: #2E2210; --warn-fg: #E3B341;
  --bad: #F85149; --bad-soft: #2E1210; --bad-fg: #FF7B72;
  --chart-1: #FFCA05; --chart-2: #FFE082; --chart-3: #B8960A;
  --chart-prev: rgba(255,202,5,0.2);
  --header-bg: #141416; --header-fg: #F8F8F8; --brand: #FFCA05;
  --hs-accent: #FF7A59;
}
:root[data-theme="light"] {
  --bg: #F8F8F8; --bg-card: #ffffff; --bg-inset: #EFEFEF; --bg-hover: #F5F5F3;
  --fg: #1C1C1E; --fg2: #494949; --fg3: #737373;
  --border: #E0E0E0; --border-focus: #FFCA05;
  --accent: #FFCA05; --accent-hover: #E5B600; --accent-soft: #FFF8E1; --accent-fg: #7A5C00;
  --good: #0E8A5F; --good-soft: #E8F8F0; --good-fg: #065F46;
  --warn: #C07800; --warn-soft: #FFF6E0; --warn-fg: #7A4D00;
  --bad: #CC3326; --bad-soft: #FDEEEC; --bad-fg: #8B1A10;
  --chart-1: #C99700; --chart-2: #494949; --chart-3: #8B6914;
  --chart-prev: rgba(201,151,0,0.22);
  --header-bg: #1C1C1E; --header-fg: #F8F8F8; --brand: #FFCA05;
  --hs-accent: #FF7A59;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Rubik',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:1280px;margin:0 auto;padding:0 16px 64px}
.app-header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px 12px;margin:0 -16px;background:var(--header-bg);border-bottom:3px solid var(--brand)}
.app-header h1{font-size:17px;font-weight:600;letter-spacing:-0.01em;color:var(--header-fg)}
.app-header .eyebrow{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--brand);margin-bottom:1px}
.app-header .subtitle{font-size:12px;color:var(--fg3);margin-top:2px}
.header-left{display:flex;align-items:center;gap:16px}
.header-logo svg{height:22px;width:auto;display:block}
.header-text{border-left:1px solid rgba(255,255,255,0.15);padding-left:16px}
.header-actions{display:flex;gap:8px;align-items:center}

.filter-bar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.filter-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);font-size:12px;font-weight:500;color:var(--fg2);cursor:pointer;user-select:none;white-space:nowrap;transition:border-color .15s,background .15s}
.filter-chip:hover{border-color:var(--fg3);background:var(--bg-hover)}
.filter-chip.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-fg)}
.filter-chip .arrow{font-size:8px;opacity:.5;margin-left:2px}
.filter-sep{width:1px;height:20px;background:var(--border);margin:0 2px}
.compare-btn{padding:5px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);font-size:12px;font-weight:500;color:var(--fg2);cursor:pointer}
.compare-btn.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-fg)}

.dropdown{position:absolute;z-index:200;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 12px rgba(0,0,0,.12);min-width:180px;max-height:320px;overflow-y:auto;display:none;padding:4px}
.dropdown.show{display:block}
.dd-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:4px;font-size:12px;color:var(--fg);cursor:pointer;white-space:nowrap}
.dd-item:hover{background:var(--bg-inset)}
.dd-item.selected{color:var(--accent-fg);font-weight:600}
.dd-item .check{width:14px;font-size:12px;color:var(--accent-fg)}
.dd-search{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;margin-bottom:4px;background:var(--bg);color:var(--fg);outline:none}
.dd-search:focus{border-color:var(--border-focus)}

.summary-box{background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:var(--radius);padding:14px 18px;margin:16px 0;font-size:13px;line-height:1.7;color:var(--fg2)}
.summary-box strong{color:var(--fg);font-weight:600}
.summary-box .hs-link{font-weight:600}

.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}
.tile{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative}
.tile:hover{border-color:var(--fg3);box-shadow:var(--shadow)}
.tile.expanded{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);border-top:2px solid var(--brand)}
.tile-label{font-size:10px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--fg3);margin-bottom:4px}
.tile-value{font-size:22px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.tile-prev{font-size:11px;color:var(--fg3);font-variant-numeric:tabular-nums;margin-top:2px}
.tile-delta{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.tile canvas{width:100%;height:28px;margin-top:6px;display:block}
.tile-expand{display:none;grid-column:1/-1;background:var(--bg-card);border:1px solid var(--border);border-top:2px solid var(--brand);border-radius:var(--radius);padding:16px;margin-top:-5px}
.tile-expand.show{display:block}

.delta-up{color:var(--good)} .delta-down{color:var(--bad)} .delta-flat{color:var(--fg3)} .delta-new{color:var(--accent-fg)}
.delta-up-inv{color:var(--bad)} .delta-down-inv{color:var(--good)}

.section{margin:24px 0}
.section-title{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent-fg);margin-bottom:12px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chart-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.chart-box h3{font-size:12px;font-weight:600;color:var(--fg);margin-bottom:8px}
.chart-box canvas{width:100%;height:220px;display:block}
.chart-legend{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.chart-legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--fg2)}
.chart-legend-item .swatch{width:10px;height:3px;border-radius:1px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12px}
thead{background:var(--bg-inset)}
th{text-align:left;padding:8px 10px;font-weight:600;font-size:11px;letter-spacing:0.03em;text-transform:uppercase;color:var(--fg2);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--fg)}
th .sort-arrow{font-size:9px;margin-left:2px;opacity:.4}
th.sorted .sort-arrow{opacity:1;color:var(--accent-fg)}
td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--fg);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--bg-hover)}

.hs-link{color:var(--hs-accent);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:4px;font-size:12px}
.hs-link:hover{text-decoration:underline}
.hs-badge{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;background:var(--hs-accent);border-radius:3px;color:#fff;font-size:8px;font-weight:800;flex-shrink:0}
.dealer-plain{font-weight:600;font-size:12px;color:var(--fg)}

.pill{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;letter-spacing:0.02em}
.pill-rules{background:var(--good-soft);color:var(--good-fg)}
.pill-llm{background:var(--accent-soft);color:var(--accent-fg)}
.pill-manual{background:var(--warn-soft);color:var(--warn-fg)}
.pill-completed{background:var(--good-soft);color:var(--good-fg)}
.pill-failed{background:var(--bad-soft);color:var(--bad-fg)}
.pill-pending{background:var(--warn-soft);color:var(--warn-fg)}
.pill-review{background:var(--accent-soft);color:var(--accent-fg)}
.pill-new{background:var(--accent-soft);color:var(--accent-fg);border:1px solid var(--accent)}

.ops-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0}
.ops-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.ops-card h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--fg3);margin-bottom:6px}
.ops-card .val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.ops-card .sub{font-size:11px;color:var(--fg2);margin-top:2px}

.quote-expand{display:none;background:var(--bg-inset);border-top:1px solid var(--border)}
.quote-expand.show{display:table-row}
.quote-expand td{padding:10px 14px}
.li-table{width:100%;font-size:11px;border:1px solid var(--border);border-radius:4px;background:var(--bg-card)}
.li-table th{font-size:10px;padding:5px 8px}
.li-table td{padding:4px 8px;font-size:11px}
.conf-bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle}
.correction-mark{background:var(--warn-soft);border-radius:2px;padding:1px 4px}

.csv-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card);font-size:12px;font-weight:500;color:var(--fg2);cursor:pointer}
.csv-btn:hover{border-color:var(--fg3);background:var(--bg-hover)}

.empty-state{text-align:center;padding:40px;color:var(--fg3);font-size:13px}

.tooltip{position:fixed;z-index:300;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:11px;box-shadow:0 4px 12px rgba(0,0,0,.15);pointer-events:none;display:none;max-width:260px;font-variant-numeric:tabular-nums}
.tooltip.show{display:block}
.tooltip .tt-label{color:var(--fg3);margin-bottom:2px}
.tooltip .tt-value{color:var(--fg);font-weight:600}
.tooltip .tt-delta{font-weight:600;margin-top:2px}

.pace-label{display:inline-block;font-size:10px;color:var(--fg3);background:var(--bg-inset);padding:2px 6px;border-radius:3px;margin-left:6px;font-weight:500}

.tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border);margin:16px 0 0}
.tab-btn{padding:8px 18px;font-size:13px;font-weight:600;color:var(--fg3);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s}
.tab-btn:hover{color:var(--fg)}
.tab-btn.active{color:var(--accent-fg);border-bottom-color:var(--brand)}
.meth{padding:20px 0;font-size:13px;line-height:1.75;color:var(--fg2)}
.meth h2{font-size:15px;font-weight:600;color:var(--fg);margin:24px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.meth h2:first-child{margin-top:0}
.meth h3{font-size:13px;font-weight:600;color:var(--fg);margin:16px 0 6px}
.meth p{margin:6px 0}
.meth ul{margin:4px 0 12px 20px}
.meth li{margin:3px 0}
.meth code{font-family:'SFMono-Regular',Consolas,monospace;font-size:11.5px;background:var(--bg-inset);padding:1px 5px;border-radius:3px;color:var(--accent-fg)}
.meth table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0 16px}
.meth th{text-align:left;padding:6px 10px;background:var(--bg-inset);border:1px solid var(--border);font-weight:600;color:var(--fg);white-space:nowrap}
.meth td{padding:6px 10px;border:1px solid var(--border);vertical-align:top}
.meth td code{font-size:11px}
@media(max-width:900px){.tiles{grid-template-columns:repeat(3,1fr)}.chart-grid{grid-template-columns:1fr}.ops-strip{grid-template-columns:1fr}}
@media(max-width:600px){.tiles{grid-template-columns:repeat(2,1fr)}.filter-bar{gap:4px}}

<script>
// ─── PRNG ───
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(2026);
function rn(a,b){return a+(b-a)*R()}
function ri(a,b){return Math.floor(rn(a,b+1))}

// ─── SAMPLE DATA ───
function genData(){
  const dealers=[
    {name:'Central Valley Building Supply',vol:12,mr:0.82,grp:'West Coast'},
    {name:'Mohler Lumber Co',vol:8,mr:0.76,grp:'Pacific NW'},
    {name:'State Lumber & Hardware',vol:9,mr:0.88,grp:'West Coast'},
    {name:'Pacific Coast Millwork',vol:3,mr:0.70,grp:null},
    {name:'Summit Building Materials',vol:10,mr:0.79,grp:'Mountain'},
    {name:'Cascade Truss & Timber',vol:6,mr:0.81,grp:'Pacific NW'},
    {name:'Heritage Hardwoods Inc',vol:4,mr:0.90,grp:null},
    {name:'Mountain West Supply',vol:7,mr:0.74,grp:'Mountain'},
    {name:'Lakeview Building Products',vol:5,mr:0.77,grp:'Midwest'},
    {name:'Pioneer Building Center',vol:2,mr:0.72,grp:null}
  ];
  const uuids=[
    '250e371d-3d82-46e7-8918-405fb0611318','f4cffe05-9b2a-4c8e-b1d3-7a6e5f892401',
    'a83d2e1f-5c74-4b9a-ae82-3f1d6c8e9502','b72f4a3e-8d15-4e6c-9f73-2e5a1b7d8603',
    'c61e3b2d-7f06-4d5b-8e64-1d4f0a6c7704','d50d2c1e-6e97-4c4a-7d55-0c3e9f5b6805',
    'e49c1b0f-5d88-4b39-6c46-fb2d8e4a5906','f38b0a9e-4c79-4a28-5b37-ea1c7d394a07',
    'a27a9f8d-3b6a-4917-4a28-d90b6c283b08','b169e87c-2a5b-4806-3919-c8fa5b172c09'
  ];
  const hsIds=['39312228506','38975296096','41023847152','40187654321','39856742310','38654921708','41298367045',null,'40512983476',null];
  const hsMap={};
  uuids.forEach((u,i)=>{if(hsIds[i])hsMap[u]={hsId:hsIds[i],hsName:dealers[i].name}});
  const TODAY=new Date();TODAY.setHours(0,0,0,0);
  const DAYS=90;
  const startDate=new Date(TODAY);startDate.setDate(startDate.getDate()-DAYS+1);
  const products=['2x4x8 SPF #2 KD','2x6x10 SPF #2','4x8 1/2" CDX Plywood','4x8 3/4" Sanded Plywood','5/8" Type X Drywall 4x8','1/2" Regular Drywall 4x12','30yr Arch Shingles Charcoal','Ice & Water Shield 200sqft','R-19 Fiberglass Batt 6.25x15','R-30 Blown-In Cellulose','1-1/4" Galv Roofing Nails 5lb','3" Deck Screws 1lb','4x4x10 PT #2 Ground Contact','6x6x12 PT #1','2x12x16 DFL #1','LVL 1.75x11.875x24','OSB 7/16 4x8','T1-11 Siding 4x8 8"OC','Simpson H2.5A Hurricane Tie','Simpson A35 Framing Angle','PVC Trim 1x4x18','Cedar 1x6x8 S4S','Hardie Plank 8.25x144','Trex Enhance 1x6x16 Clam Shell'];
  const skus=products.map((_,i)=>'SKU-'+String(10000+i));
  const subjects=['Quote Request - New Construction','RE: Material List for Project','Fwd: Lumber Order','Material Takeoff - Smith Residence','Bid Package - Commercial','Supply List - Renovation','Framing Package Request','Deck Materials Quote','Roofing Materials Order','Siding & Trim Quote'];
  const senders=['orders@','purchasing@','mike.johnson@','sarah.chen@','bob.williams@','quotes@','estimating@','tom.garcia@','lisa.martinez@','dave.anderson@'];
  const domains=['gmail.com','yahoo.com','outlook.com','contractor.com','buildpro.com'];
  const errors=['PDF_PARSE_FAILURE','EXTRACTION_TIMEOUT','CATALOG_UNAVAILABLE','LLM_RATE_LIMIT','INVALID_FORMAT'];
  const dealerData=dealers.map((d,di)=>{
    const dm=[];
    for(let day=0;day<DAYS;day++){
      const dt=new Date(startDate);dt.setDate(dt.getDate()+day);
      const dateStr=dt.toISOString().slice(0,10);
      const dayOfWeek=dt.getDay();
      const weekendFactor=dayOfWeek===0||dayOfWeek===6?0.3:1;
      const trendFactor=1+day/DAYS*0.15;
      const baseQ=Math.max(0,Math.round(d.vol/5*weekendFactor*trendFactor*rn(0.6,1.4)));
      if(baseQ===0){dm.push(null);continue}
      const completed=Math.max(0,baseQ-ri(0,Math.max(0,Math.floor(baseQ*0.08))));
      const failed=ri(0,Math.min(2,baseQ-completed));
      const review=Math.max(0,baseQ-completed-failed);
      const converted=Math.round(completed*rn(0.55,0.75));
      const liPerQ=rn(6,18);
      const totalLI=Math.round(baseQ*liPerQ);
      const dayMR=Math.min(0.98,d.mr+day/DAYS*0.06+rn(-0.04,0.04));
      const matched=Math.round(totalLI*dayMR);
      const corrected=Math.round(matched*rn(0.08,0.2)*(1-day/DAYS*0.3));
      const rulesRate=Math.min(0.85,0.35+day/DAYS*0.25+rn(-0.05,0.05));
      const ruleM=Math.round(matched*rulesRate);
      const manualM=ri(0,Math.round(totalLI*0.03));
      const llmM=Math.max(0,matched-ruleM-manualM);
      const headerFields=7;
      const unitsPerQ=Math.round(liPerQ-liPerQ*0.03+rn(3,headerFields)+rn(0,1));
      const units=baseQ*unitsPerQ;
      const rateCents=ri(3,8);
      const capCents=ri(80,200);
      const billedPerQ=Math.min(unitsPerQ*rateCents,capCents);
      const billedCents=baseQ*billedPerQ;
      const extCost=baseQ*rn(0.02,0.06);
      const matchCost=llmM*rn(0.003,0.008);
      const resCost=baseQ*rn(0.01,0.03);
      const srcE=Math.round(baseQ*rn(0.3,0.5));
      const srcA=Math.round(baseQ*rn(0.1,0.3)*(1+day/DAYS*0.5));
      const srcU=Math.max(0,baseQ-srcE-srcA);
      const pSec=rn(8,45);
      dm.push({
        date:dateStr,quotes:baseQ,completedQuotes:completed,failedQuotes:failed,
        needsReviewQuotes:review,convertedQuotes:converted,
        totalLineItems:totalLI,matchedLineItems:matched,correctedItems:corrected,
        rulesEngineMatches:ruleM,llmMatches:llmM,manualMatches:manualM,
        units:Math.round(units),billedCents:Math.round(billedCents),
        extractionCostUsd:+extCost.toFixed(4),matchingCostUsd:+matchCost.toFixed(4),
        resolutionCostUsd:+resCost.toFixed(4),
        uniqueSenders:ri(1,Math.min(baseQ,5)),
        sourceEmail:srcE,sourceUpload:srcU,sourceAddIn:srcA,
        sumProcessingSeconds:Math.round(baseQ*pSec),
        p50LatencySeconds:Math.round(pSec*0.7),p90LatencySeconds:Math.round(pSec*1.8),
        hasCustomerName:Math.round(baseQ*rn(0.7,0.95)),hasCustomerEmail:Math.round(baseQ*rn(0.5,0.8)),
        hasCustomerPhone:Math.round(baseQ*rn(0.3,0.6)),hasAccountNumber:Math.round(baseQ*rn(0.4,0.7)),
        hasDeliveryAddress:Math.round(baseQ*rn(0.3,0.55)),hasRequestedDeliveryDate:Math.round(baseQ*rn(0.2,0.5)),
        hasNotes:Math.round(baseQ*rn(0.4,0.65)),
        rerunCount:ri(0,Math.round(baseQ*0.1)),capsHit:ri(0,Math.round(baseQ*0.15)),
        capSavingsCents:ri(0,baseQ*5)
      });
    }
    const dailyMetrics=dm.filter(Boolean);
    const topSenders=Array.from({length:ri(3,6)},(_,si)=>({
      email:senders[si%senders.length]+d.name.split(' ')[0].toLowerCase()+'.com',
      quoteCount:ri(5,40),avgLineItems:+rn(8,16).toFixed(1)
    })).sort((a,b)=>b.quoteCount-a.quoteCount);
    return{
      id:uuids[di],name:d.name,groupName:d.grp,
      isRulesEnabled:di<8,
      firstQuoteDate:dailyMetrics.length?dailyMetrics[0].date:null,
      billingConfig:{perUnitRateCents:ri(3,8),perIngestionCapCents:ri(80,200),monthlyMinimumCents:ri(5000,15000)},
      knowledgeBase:{tipCount:ri(5,50),synonymCount:ri(10,80),specialOrderProductCount:ri(2,20)},
      dailyMetrics,topSenders
    };
  });

  const quotes=[];
  dealerData.forEach(dealer=>{
    const nq=ri(8,15);
    for(let qi=0;qi<nq;qi++){

// ─── FILTER RATIO ───
function filterRatio(m,filters){
  if(!filters)return 1;
  let r=1;
  if(filters.source&&m.quotes>0){
    const srcMap={EMAIL:'sourceEmail',UPLOAD:'sourceUpload',ADD_IN:'sourceAddIn'};
    r*=(m[srcMap[filters.source]]||0)/m.quotes;
  }
  if(filters.status&&m.quotes>0){
    const stMap={COMPLETED:'completedQuotes',FAILED:'failedQuotes',REQUIRES_REVIEW:'needsReviewQuotes',PENDING:null,PROCESSING:null};
    const field=stMap[filters.status];
    if(field)r*=(m[field]||0)/m.quotes;
    else r*=Math.max(0,m.quotes-(m.completedQuotes||0)-(m.failedQuotes||0)-(m.needsReviewQuotes||0))/m.quotes;
  }
  if(filters.matchSource){
    const total=(m.rulesEngineMatches||0)+(m.llmMatches||0)+(m.manualMatches||0);
    if(total>0){
      const msMap={RULES_ENGINE:'rulesEngineMatches',LLM:'llmMatches',MANUAL:'manualMatches'};
      r*=(m[msMap[filters.matchSource]]||0)/total;
    } else r=0;
  }
  return r;
}

// ─── AGGREGATION ───
function aggDaily(dealers,start,end,dealerId,filters){
  const s=fmtDate(start),e=fmtDate(end);
  const acc={quotes:0,completedQuotes:0,failedQuotes:0,needsReviewQuotes:0,convertedQuotes:0,
    totalLineItems:0,matchedLineItems:0,correctedItems:0,
    rulesEngineMatches:0,llmMatches:0,manualMatches:0,
    units:0,billedCents:0,extractionCostUsd:0,matchingCostUsd:0,resolutionCostUsd:0,
    uniqueSenders:0,sourceEmail:0,sourceUpload:0,sourceAddIn:0,
    p50Sum:0,p90Sum:0,dayCount:0,
    hasCustomerName:0,hasCustomerEmail:0,hasCustomerPhone:0,hasAccountNumber:0,
    hasDeliveryAddress:0,hasRequestedDeliveryDate:0,hasNotes:0,
    rerunCount:0,capsHit:0,capSavingsCents:0};
  const hasFilters=filters&&(filters.source||filters.status||filters.matchSource);
  const activeDealers=new Set();
  const filtered=dealerId?dealers.filter(d=>d.id===dealerId):dealers;
  filtered.forEach(d=>{
    let hadActivity=false;
    d.dailyMetrics.forEach(m=>{
      if(m.date>=s&&m.date<=e){
        const r=hasFilters?filterRatio(m,filters):1;
        if(r>0){
          Object.keys(acc).forEach(k=>{if(k!=='dayCount'&&k!=='p50Sum'&&k!=='p90Sum'&&m[k]!=null)acc[k]+=m[k]*r});
          acc.p50Sum+=m.p50LatencySeconds||0;acc.p90Sum+=m.p90LatencySeconds||0;acc.dayCount++;
          hadActivity=true;
        }
      }
    });
    if(hadActivity)activeDealers.add(d.id);
  });
  acc.activeDealers=activeDealers.size;
  acc.matchRate=acc.totalLineItems?acc.matchedLineItems/acc.totalLineItems:0;
  acc.correctionRate=acc.matchedLineItems?acc.correctedItems/acc.matchedLineItems:0;
  acc.conversionRate=acc.completedQuotes?acc.convertedQuotes/acc.completedQuotes:0;
  acc.failureRate=acc.quotes?acc.failedQuotes/acc.quotes:0;
  acc.rulesRate=(acc.rulesEngineMatches+acc.llmMatches+acc.manualMatches)?acc.rulesEngineMatches/(acc.rulesEngineMatches+acc.llmMatches+acc.manualMatches):0;
  acc.totalCostUsd=acc.extractionCostUsd+acc.matchingCostUsd+acc.resolutionCostUsd;
  acc.revenueUsd=acc.billedCents/100;
  acc.margin=acc.revenueUsd?Math.max(0,(acc.revenueUsd-acc.totalCostUsd)/acc.revenueUsd):0;
  acc.p50Latency=acc.dayCount?acc.p50Sum/acc.dayCount:0;
  acc.p90Latency=acc.dayCount?acc.p90Sum/acc.dayCount:0;
  Object.keys(acc).forEach(k=>{if(typeof acc[k]==='number'&&k!=='matchRate'&&k!=='correctionRate'&&k!=='conversionRate'&&k!=='failureRate'&&k!=='rulesRate'&&k!=='margin'&&k!=='p50Latency'&&k!=='p90Latency')acc[k]=Math.round(acc[k]*100)/100});
  return acc;
}

// ─── FORMAT UTILS ───
function fmt(n,type){
  switch(type){
    case'pct':return(n*100).toFixed(1)+'%';
    case'pp':return(n*100).toFixed(1)+'pp';
    case'$':return'$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
    case'$2':return'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    case'int':return Math.round(n).toLocaleString();
    default:return String(n);
  }
}

const INVERTED_METRICS=new Set(['correctionRate','failureRate','internalCost','totalCostUsd','extractionCostUsd','matchingCostUsd','resolutionCostUsd']);
const RATE_METRICS=new Set(['matchRate','correctionRate','conversionRate','failureRate','rulesRate','margin']);

function deltaClass(diff,metric){
  if(diff===0)return'delta-flat';
  const inv=INVERTED_METRICS.has(metric);
  const pos=diff>0;
  if(inv)return pos?'delta-up-inv':'delta-down-inv';
  return pos?'delta-up':'delta-down';
}

function fmtDelta(cur,prev,metric){
  if(prev==null)return{text:'New',cls:'delta-new'};
  const diff=cur-prev;
  if(diff===0)return{text:'0',cls:'delta-flat'};
  const isRate=RATE_METRICS.has(metric);
  const cls=deltaClass(diff,metric);
  let text;
  if(isRate){
    text=(diff>0?'+':'')+((diff)*100).toFixed(1)+'pp';
  } else if(metric.includes('Cost')||metric.includes('revenue')||metric==='revenueUsd'){
    const pct=prev!==0?((diff/prev)*100).toFixed(1):'∞';
    text=(diff>0?'+':'')+fmt(diff,'$')+' ('+(diff>0?'+':'')+pct+'%)';
  } else {
    const pct=prev!==0?((diff/prev)*100).toFixed(1):'∞';
    text=(diff>0?'+':'')+Math.round(diff).toLocaleString()+' ('+(diff>0?'+':'')+pct+'%)';
  }
  return{text,cls};
}

// ─── CHART ENGINE ───
function initCanvas(canvas){
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
  return{ctx,w:rect.width,h:rect.height};
}

function getStyle(prop){return getComputedStyle(document.documentElement).getPropertyValue(prop).trim()}

function drawSparkline(canvas,values,color){
  if(!values.length)return;
  const{ctx,w,h}=initCanvas(canvas);
  const max=Math.max(...values,1);const min=Math.min(...values,0);
  const range=max-min||1;
  const pad=2;const pw=w-pad*2;const ph=h-pad*2;
  ctx.beginPath();
  values.forEach((v,i)=>{
    const x=pad+i/(values.length-1)*pw;
    const y=pad+ph-(v-min)/range*ph;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.strokeStyle=color||getStyle('--accent');ctx.lineWidth=1.5;ctx.lineJoin='round';ctx.stroke();
  ctx.lineTo(pad+pw,pad+ph);ctx.lineTo(pad,pad+ph);ctx.closePath();
  ctx.fillStyle=(color||getStyle('--accent')).replace(')',',0.08)').replace('rgb','rgba');
  ctx.fill();
}

function drawBarChart(canvas,data,prevData,opts={}){
  const{ctx,w,h}=initCanvas(canvas);
  const pad={top:20,right:16,bottom:36,left:48};
  const pw=w-pad.left-pad.right;const ph=h-pad.top-pad.bottom;
  const vals=data.map(d=>d.value);
  const prevVals=prevData?prevData.map(d=>d.value):null;
  const allVals=[...vals,...(prevVals||[])];
  const maxV=Math.max(...allVals,1);
  const gridLines=4;
  ctx.font='10px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';
  ctx.fillStyle=getStyle('--fg3');
  for(let i=0;i<=gridLines;i++){
    const y=pad.top+ph-ph*i/gridLines;
    const v=maxV*i/gridLines;
    ctx.fillText(opts.fmtY?opts.fmtY(v):Math.round(v).toLocaleString(),pad.left-6,y);
    ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(pad.left+pw,y);
    ctx.strokeStyle=getStyle('--border');ctx.lineWidth=0.5;ctx.stroke();
  }
  const barW=Math.max(4,pw/data.length*0.6);
  const gap=pw/data.length;
  data.forEach((d,i)=>{
    const x=pad.left+i*gap+gap/2;
    const bh=ph*d.value/maxV;
    if(prevVals&&prevVals[i]!=null){
      const pbh=ph*prevVals[i]/maxV;
      ctx.strokeStyle=getStyle('--chart-prev');ctx.lineWidth=1.5;
      ctx.strokeRect(x-barW/2,pad.top+ph-pbh,barW,pbh);
    }
    ctx.fillStyle=opts.color||getStyle('--chart-1');
    ctx.fillRect(x-barW/2,pad.top+ph-bh,barW,bh);
    if(i%(Math.ceil(data.length/10))===0||data.length<=15){
      ctx.fillStyle=getStyle('--fg3');ctx.font='9px system-ui';ctx.textAlign='center';
      ctx.fillText(d.label,x,pad.top+ph+14);
    }
  });
  if(opts.title){ctx.fillStyle=getStyle('--fg2');ctx.font='600 11px system-ui';ctx.textAlign='left';ctx.fillText(opts.title,pad.left,12)}
}

function drawLineChart(canvas,series,prevSeries,opts={}){
  const{ctx,w,h}=initCanvas(canvas);
  const pad={top:20,right:16,bottom:36,left:48};
  const pw=w-pad.left-pad.right;const ph=h-pad.top-pad.bottom;
  let maxV=0;
  series.forEach(s=>{maxV=Math.max(maxV,...s.data.map(d=>d.value))});
  if(prevSeries)prevSeries.forEach(s=>{maxV=Math.max(maxV,...s.data.map(d=>d.value))});
  maxV=maxV||1;
  if(opts.maxY)maxV=opts.maxY;
  const gridLines=4;
  ctx.font='10px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';
  for(let i=0;i<=gridLines;i++){
    const y=pad.top+ph-ph*i/gridLines;const v=maxV*i/gridLines;
    ctx.fillStyle=getStyle('--fg3');
    ctx.fillText(opts.fmtY?opts.fmtY(v):Math.round(v).toLocaleString(),pad.left-6,y);
    ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(pad.left+pw,y);
    ctx.strokeStyle=getStyle('--border');ctx.lineWidth=0.5;ctx.stroke();
  }
  const colors=[getStyle('--chart-1'),getStyle('--chart-2'),getStyle('--chart-3')];
  if(prevSeries){
    prevSeries.forEach((s,si)=>{
      if(!s.data.length)return;
      ctx.beginPath();ctx.setLineDash([4,4]);ctx.strokeStyle=colors[si%3];ctx.globalAlpha=0.3;ctx.lineWidth=1.5;
      s.data.forEach((d,i)=>{
        const x=pad.left+i/(s.data.length-1)*pw;
        const y=pad.top+ph-d.value/maxV*ph;
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      });
      ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
    });
  }
  series.forEach((s,si)=>{
    if(!s.data.length)return;
    ctx.beginPath();ctx.strokeStyle=s.color||colors[si%3];ctx.lineWidth=2;ctx.lineJoin='round';
    s.data.forEach((d,i)=>{
      const x=pad.left+i/(s.data.length-1)*pw;
      const y=pad.top+ph-d.value/maxV*ph;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.stroke();
    ctx.beginPath();
    s.data.forEach((d,i)=>{
      const x=pad.left+i/(s.data.length-1)*pw;
      const y=pad.top+ph-d.value/maxV*ph;
      ctx.moveTo(x+2.5,y);ctx.arc(x,y,2.5,0,Math.PI*2);
    });
    ctx.fillStyle=s.color||colors[si%3];ctx.fill();
  });
  if(series[0]&&series[0].data.length){
    const labels=series[0].data;
    const step=Math.max(1,Math.ceil(labels.length/10));
    ctx.font='9px system-ui';ctx.textAlign='center';ctx.fillStyle=getStyle('--fg3');
    labels.forEach((d,i)=>{if(i%step===0){
      const x=pad.left+i/(labels.length-1)*pw;
      ctx.fillText(d.label,x,pad.top+ph+14);
    }});
  }
  if(opts.title){ctx.fillStyle=getStyle('--fg2');ctx.font='600 11px system-ui';ctx.textAlign='left';ctx.fillText(opts.title,pad.left,12)}
}

function drawStackedArea(canvas,seriesArr,opts={}){
  const{ctx,w,h}=initCanvas(canvas);
  const pad={top:20,right:16,bottom:36,left:48};
  const pw=w-pad.left-pad.right;const ph=h-pad.top-pad.bottom;
  const len=seriesArr[0]?.data.length||0;if(!len)return;
  const totals=Array.from({length:len},(_,i)=>seriesArr.reduce((s,sr)=>s+(sr.data[i]?.value||0),0));
  const maxV=Math.max(...totals,1);
  const gridLines=4;
  ctx.font='10px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';
  for(let i=0;i<=gridLines;i++){
    const y=pad.top+ph-ph*i/gridLines;const v=maxV*i/gridLines;
    ctx.fillStyle=getStyle('--fg3');ctx.fillText(Math.round(v).toLocaleString(),pad.left-6,y);
    ctx.beginPath();ctx.moveTo(pad.left,y);ctx.lineTo(pad.left+pw,y);
    ctx.strokeStyle=getStyle('--border');ctx.lineWidth=0.5;ctx.stroke();
  }
  const colors=[getStyle('--chart-1'),getStyle('--chart-2'),getStyle('--chart-3')];
  for(let si=seriesArr.length-1;si>=0;si--){
    ctx.beginPath();
    const cumBelow=Array.from({length:len},(_,i)=>{
      let s=0;for(let j=0;j<si;j++)s+=seriesArr[j].data[i]?.value||0;return s;
    });
    for(let i=0;i<len;i++){
      const x=pad.left+i/(len-1)*pw;
      const y=pad.top+ph-(cumBelow[i]+(seriesArr[si].data[i]?.value||0))/maxV*ph;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    for(let i=len-1;i>=0;i--){
      const x=pad.left+i/(len-1)*pw;
      const y=pad.top+ph-cumBelow[i]/maxV*ph;
      ctx.lineTo(x,y);
    }
    ctx.closePath();ctx.fillStyle=colors[si%3];ctx.globalAlpha=0.5;ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle=colors[si%3];ctx.lineWidth=1.5;
    ctx.beginPath();
    for(let i=0;i<len;i++){
      const x=pad.left+i/(len-1)*pw;
      const y=pad.top+ph-(cumBelow[i]+(seriesArr[si].data[i]?.value||0))/maxV*ph;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  if(seriesArr[0]?.data.length){
    const labels=seriesArr[0].data;const step=Math.max(1,Math.ceil(labels.length/10));
    ctx.font='9px system-ui';ctx.textAlign='center';ctx.fillStyle=getStyle('--fg3');
    labels.forEach((d,i)=>{if(i%step===0){const x=pad.left+i/(labels.length-1)*pw;ctx.fillText(d.label,x,pad.top+ph+14)}});
  }
  if(opts.title){ctx.fillStyle=getStyle('--fg2');ctx.font='600 11px system-ui';ctx.textAlign='left';ctx.fillText(opts.title,pad.left,12)}
}

function drawDonut(canvas,segments,opts={}){
  const{ctx,w,h}=initCanvas(canvas);
  const cx=w/2;const cy=h/2;const r=Math.min(w,h)/2-20;const inner=r*0.55;
  const total=segments.reduce((s,seg)=>s+seg.value,0)||1;
  const colors=[getStyle('--chart-1'),getStyle('--chart-2'),getStyle('--chart-3'),getStyle('--fg3')];
  let angle=-Math.PI/2;
  segments.forEach((seg,i)=>{
    const sweep=seg.value/total*Math.PI*2;
    ctx.beginPath();ctx.moveTo(cx+inner*Math.cos(angle),cy+inner*Math.sin(angle));
    ctx.arc(cx,cy,r,angle,angle+sweep);ctx.arc(cx,cy,inner,angle+sweep,angle,true);
    ctx.closePath();ctx.fillStyle=seg.color||colors[i%4];ctx.fill();
    angle+=sweep;
  });
  if(opts.centerText){
    ctx.fillStyle=getStyle('--fg');ctx.font='700 16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(opts.centerText,cx,cy-6);
    if(opts.centerSub){ctx.fillStyle=getStyle('--fg3');ctx.font='10px system-ui';ctx.fillText(opts.centerSub,cx,cy+10)}
  }
}

function drawHBar(canvas,items,opts={}){
  const{ctx,w,h}=initCanvas(canvas);
  const pad={top:8,right:50,bottom:8,left:120};
  const pw=w-pad.left-pad.right;const ph=h-pad.top-pad.bottom;
  const maxV=Math.max(...items.map(d=>d.value),0.01);
  const barH=Math.min(20,ph/items.length*0.7);
  const gap=ph/items.length;
  items.forEach((d,i)=>{
    const y=pad.top+i*gap+gap/2;
    const bw=pw*d.value/maxV;
    ctx.fillStyle=getStyle('--chart-1');ctx.globalAlpha=0.7;
    ctx.fillRect(pad.left,y-barH/2,bw,barH);ctx.globalAlpha=1;
    ctx.fillStyle=getStyle('--fg2');ctx.font='11px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText(d.label,pad.left-8,y);
    ctx.fillStyle=getStyle('--fg');ctx.textAlign='left';ctx.font='600 11px system-ui';
    ctx.fillText((d.value*100).toFixed(0)+'%',pad.left+bw+6,y);
  });
}

function renderAll(){

  const cur=aggDaily(DATA.dealers,range.start,range.end,state.dealer,flt);

function renderSummary(cur,prv,range,prev){
  const el=document.createElement('div');el.className='summary-box';
  const topDealer=DATA.dealers.slice().sort((a,b)=>{
    const aa=aggDealer(a,range.start,range.end);const bb=aggDealer(b,range.start,range.end);
    return bb.quotes-aa.quotes;
  })[0];

      const items=fields.map(f=>({label:f.label,value:agg.quotes?agg[f.key]/agg.quotes:0}));
      drawHBar(c,items);
    }
  });
  return sec;
}

function renderQuoteDetail(range){
  const sec=document.createElement('div');sec.className='section';
  let quotes=DATA.quotes.filter(q=>{
    const d=new Date(q.createdAt);d.setHours(0,0,0,0);
    if(d<range.start||d>range.end)return false;
    if(state.dealer&&q.dealerId!==state.dealer)return false;
    if(state.source&&q.source!==state.source)return false;
    if(state.status&&q.processingStatus!==state.status)return false;
    return true;
  });
  if(state.matchSource){
    quotes=quotes.filter(q=>q.lineItems.some(li=>li.matchSource===state.matchSource));
  }

  let html=`<div class="section-title">Quote Detail (${quotes.length})</div><div class="tbl-wrap"><table><thead><tr>
    <th>Date</th><th>Dealer</th><th>Subject</th><th>Source</th><th>Status</th>
    <th>Items</th><th>Match Rate</th><th>Units</th><th>Billed</th><th>Conv.</th>
  </tr></thead><tbody>`;
  quotes.slice(0,50).forEach(q=>{
    const dealer=DATA.dealers.find(d=>d.id===q.dealerId);
    const mr=q.lineItemCount?q.matchedItemCount/q.lineItemCount:0;
    const expanded=state.expandedQuotes.has(q.id);
    const statusCls={'COMPLETED':'pill-completed','FAILED':'pill-failed','PENDING':'pill-pending','PROCESSING':'pill-pending','REQUIRES_REVIEW':'pill-review'}[q.processingStatus]||'';
    html+=`<tr class="clickable" data-quote-id="${q.id}">
      <td style="white-space:nowrap">${q.createdAt.slice(0,10)}</td>
      <td style="white-space:nowrap">${dealer?hsLink(dealer.id,dealer.name):esc(q.dealerId.slice(0,8))}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(q.subject)}</td>
      <td><span class="pill pill-${q.source==='EMAIL'?'completed':q.source==='UPLOAD'?'pending':'review'}">${q.source}</span></td>
      <td><span class="pill ${statusCls}">${q.processingStatus.replace('REQUIRES_','')}</span></td>
      <td>${q.lineItemCount}</td><td>${fmt(mr,'pct')}</td><td>${q.units}</td>
      <td>${fmt(q.billedCents/100,'$2')}</td>
      <td>${q.convertedQuoteId?'<span class="pill pill-completed">Yes</span>':'—'}</td>
    </tr>`;
    if(expanded){
      html+=`<tr class="quote-expand show"><td colspan="10"><table class="li-table"><thead><tr>
        <th>Description</th><th>Qty</th><th>Matched SKU</th><th>Conf.</th><th>Source</th><th>Orig. SKU</th>
      </tr></thead><tbody>`;
      q.lineItems.forEach(li=>{
        const corrected=li.aiOriginalSku&&li.matchedProductSku&&li.aiOriginalSku!==li.matchedProductSku;
        const srcCls={'RULES_ENGINE':'pill-rules','LLM':'pill-llm','MANUAL':'pill-manual'}[li.matchSource]||'';
        html+=`<tr${li.isSectionLine?' style="color:var(--fg3);font-style:italic"':''}${li.isDeleted?' style="text-decoration:line-through;opacity:.5"':''}>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${esc(li.originalDescription)}</td>
          <td>${li.quantity} ${li.unit||''}</td>
          <td>${corrected?'<span class="correction-mark">':''}<span>${esc(li.matchedProductSku||'—')}</span>${corrected?'</span>':''}</td>
          <td>${li.confidence!=null?'<span class="conf-bar" style="width:'+Math.round(li.confidence*50)+'px"></span> '+(li.confidence*100).toFixed(0)+'%':'—'}</td>
          <td><span class="pill ${srcCls}">${li.matchSource||'—'}</span></td>
          <td style="color:${corrected?'var(--warn)':'var(--fg3)'}">${esc(li.aiOriginalSku||'—')}</td>
        </tr>`;
      });
      html+='</tbody></table></td></tr>';
    }
  });
  if(!quotes.length)html+='<tr><td colspan="10" class="empty-state">No quotes match the current filters.</td></tr>';
  html+='</tbody></table></div>';
  if(quotes.length>50)html+=`<div style="text-align:center;padding:12px;color:var(--fg3);font-size:12px">Showing 50 of ${quotes.length} quotes</div>`;
  sec.innerHTML=html;

  sec.querySelectorAll('tr[data-quote-id]').forEach(tr=>{
    tr.addEventListener('click',()=>{
      const id=tr.dataset.quoteId;
      if(state.expandedQuotes.has(id))state.expandedQuotes.delete(id);else state.expandedQuotes.add(id);
      renderAll();
    });
  });
  return sec;
}

// ─── FILTER BAR ───
const PERIODS=[
  {key:'this-week',label:'This week'},{key:'last-week',label:'Last week'},
  {key:'this-month',label:'This month'},{key:'last-month',label:'Last month'},
  {key:'this-quarter',label:'This quarter'},
  {key:'last-30',label:'Last 30 days'},{key:'last-90',label:'Last 90 days'}
];
const SOURCES=[{key:null,label:'All sources'},{key:'EMAIL',label:'Email'},{key:'UPLOAD',label:'Upload'},{key:'ADD_IN',label:'Add-in'}];
const STATUSES=[{key:null,label:'All statuses'},{key:'COMPLETED',label:'Completed'},{key:'FAILED',label:'Failed'},{key:'PENDING',label:'Pending'},{key:'PROCESSING',label:'Processing'},{key:'REQUIRES_REVIEW',label:'Needs Review'}];
const MATCH_SOURCES=[{key:null,label:'All match sources'},{key:'RULES_ENGINE',label:'Rules Engine'},{key:'LLM',label:'LLM'},{key:'MANUAL',label:'Manual'}];

function renderFilters(){
  const bar=document.getElementById('filter-bar');
  const periodLabel=PERIODS.find(p=>p.key===state.period)?.label||'This month';
  const dealerLabel=state.dealer?DATA.dealers.find(d=>d.id===state.dealer)?.name||'Dealer':'All dealers';
  const sourceLabel=SOURCES.find(s=>s.key===state.source)?.label||'All sources';
  const statusLabel=STATUSES.find(s=>s.key===state.status)?.label||'All statuses';
  const msLabel=MATCH_SOURCES.find(s=>s.key===state.matchSource)?.label||'All match sources';

  bar.innerHTML=`
    <button class="filter-chip ${state.period!=='this-month'?'active':''}" data-filter="period">${periodLabel} <span class="arrow">▾</span></button>
    <button class="compare-btn ${state.compare?'active':''}" id="compare-toggle">${state.compare?'Compare: On':'Compare: Off'}</button>
    <div class="filter-sep"></div>
    <button class="filter-chip ${state.dealer?'active':''}" data-filter="dealer">${state.dealer?dealerLabel.length>20?dealerLabel.slice(0,18)+'…':dealerLabel:'All dealers'} <span class="arrow">▾</span></button>
    <button class="filter-chip ${state.source?'active':''}" data-filter="source">${sourceLabel} <span class="arrow">▾</span></button>
    <button class="filter-chip ${state.status?'active':''}" data-filter="status">${statusLabel} <span class="arrow">▾</span></button>
    <button class="filter-chip ${state.matchSource?'active':''}" data-filter="matchSource">${msLabel} <span class="arrow">▾</span></button>`;

  document.getElementById('compare-toggle').addEventListener('click',()=>{
    state.compare=!state.compare;syncHash();renderFilters();renderAll();
  });

  bar.querySelectorAll('.filter-chip').forEach(chip=>{
    chip.addEventListener('click',(e)=>{
      e.stopPropagation();
      showDropdown(chip,chip.dataset.filter);
    });
  });
}

function showDropdown(anchor,filterType){
  const dd=document.getElementById('dropdown');
  const rect=anchor.getBoundingClientRect();
  dd.style.top=(rect.bottom+4)+'px';dd.style.left=rect.left+'px';
  dd.className='dropdown show';

  let items;
  switch(filterType){
    case'period':items=PERIODS.map(p=>({key:p.key,label:p.label,selected:state.period===p.key}));break;
    case'source':items=SOURCES.map(s=>({key:s.key,label:s.label,selected:state.source===s.key}));break;
    case'status':items=STATUSES.map(s=>({key:s.key,label:s.label,selected:state.status===s.key}));break;
    case'matchSource':items=MATCH_SOURCES.map(s=>({key:s.key,label:s.label,selected:state.matchSource===s.key}));break;
    case'dealer':
      items=[{key:null,label:'All dealers',selected:!state.dealer},...DATA.dealers.map(d=>({key:d.id,label:d.name,selected:state.dealer===d.id}))];
      break;
  }

  let html='';
  if(filterType==='dealer')html+='<input class="dd-search" placeholder="Search dealers…" autofocus>';
  items.forEach(item=>{
    html+=`<div class="dd-item ${item.selected?'selected':''}" data-key="${item.key||''}">`+
      `<span class="check">${item.selected?'✓':''}</span>${esc(item.label)}</div>`;
  });
  dd.innerHTML=html;

  if(filterType==='dealer'){
    const search=dd.querySelector('.dd-search');
    search.addEventListener('input',()=>{
      const q=search.value.toLowerCase();
      dd.querySelectorAll('.dd-item').forEach(el=>{
        const label=el.textContent.toLowerCase();
        el.style.display=label.includes(q)?'':'none';
      });
    });
    requestAnimationFrame(()=>search.focus());
  }

  dd.querySelectorAll('.dd-item').forEach(el=>{
    el.addEventListener('click',()=>{
      const key=el.dataset.key||null;
      switch(filterType){
        case'period':state.period=key||'this-month';break;
        case'source':state.source=key;break;
        case'status':state.status=key;break;
        case'matchSource':state.matchSource=key;break;
        case'dealer':state.dealer=key;break;
      }
      dd.className='dropdown';syncHash();renderFilters();renderAll();
    });
  });
}

document.addEventListener('click',(e)=>{
  const dd=document.getElementById('dropdown');
  if(!dd.contains(e.target)&&!e.target.closest('.filter-chip'))dd.className='dropdown';
});

// ─── URL HASH ───
function syncHash(){
  const parts=[];
  if(state.period!=='this-month')parts.push('period='+state.period);
  if(state.dealer)parts.push('dealer='+state.dealer);
  if(state.source)parts.push('source='+state.source);
  if(state.status)parts.push('status='+state.status);
  if(state.matchSource)parts.push('matchSource='+state.matchSource);
  if(!state.compare)parts.push('compare=off');
  if(state.tab==='methodology')parts.push('tab=methodology');
  location.hash=parts.join('&');
}
function readHash(){
  const h=location.hash.slice(1);if(!h)return;
  h.split('&').forEach(p=>{
    const[k,v]=p.split('=');
    if(k==='period')state.period=v;
    if(k==='dealer')state.dealer=v;
    if(k==='source')state.source=v;
    if(k==='status')state.status=v;
    if(k==='matchSource')state.matchSource=v;
    if(k==='compare')state.compare=v!=='off';
    if(k==='tab')state.tab=v;
  });
}

// ─── CSV EXPORT ───
function exportCSV(type){
  let csv='';
  if(type==='dealers'){
    const range=getPeriodRange(state.period);
    const fltC={source:state.source,status:state.status,matchSource:state.matchSource};
    csv='Dealer,Quotes,Units,Match Rate,Correction Rate,Rules %,Revenue,Cost,Margin,Conversion\n';
    DATA.dealers.forEach(d=>{
      const a=aggDealer(d,range.start,range.end,fltC);
      csv+=`"${d.name}",${a.quotes},${a.units},${(a.matchRate*100).toFixed(1)}%,${(a.correctionRate*100).toFixed(1)}%,${(a.rulesRate*100).toFixed(1)}%,$${a.revenueUsd.toFixed(2)},$${a.totalCostUsd.toFixed(2)},${(a.margin*100).toFixed(1)}%,${(a.conversionRate*100).toFixed(1)}%\n`;
    });
  } else {
    const range=getPeriodRange(state.period);
    csv='Date,Dealer,Subject,Source,Status,Items,Match Rate,Units,Billed,Converted\n';
    DATA.quotes.filter(q=>{
      const d=new Date(q.createdAt);d.setHours(0,0,0,0);
      return d>=range.start&&d<=range.end&&(!state.dealer||q.dealerId===state.dealer);
    }).forEach(q=>{
      const dealer=DATA.dealers.find(d=>d.id===q.dealerId);
      const mr=q.lineItemCount?(q.matchedItemCount/q.lineItemCount*100).toFixed(1)+'%':'0%';
      csv+=`${q.createdAt.slice(0,10)},"${dealer?.name||''}","${q.subject}",${q.source},${q.processingStatus},${q.lineItemCount},${mr},${q.units},$${(q.billedCents/100).toFixed(2)},${q.convertedQuoteId?'Yes':'No'}\n`;
    });
  }
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`aioe-${type}-${fmtDate(TODAY)}.csv`;a.click();
  URL.revokeObjectURL(a.href);
}

// ─── METHODOLOGY ───
function renderMethodology(){
  const sec=document.createElement('div');sec.className='meth';
  sec.innerHTML=`
<h2>How This Dashboard Works</h2>
<p>Self-contained HTML artifact with all charts rendered via <code>&lt;canvas&gt;</code> (no external libraries). Data is aggregated client-side from a JSON payload of daily metrics per dealer. Period comparison shifts the date window backward by the same number of days.</p>
<ul>
  <li><strong>Aggregation</strong> &mdash; daily metric rows are summed across the selected period and dealer; rates (match, correction, conversion, margin) are derived from the summed numerators/denominators.</li>
  <li><strong>Filter cascade</strong> &mdash; Source, Status, and Match Source filters scale all sections proportionally using daily sub-counts (e.g. <code>sourceEmail / quotes</code>). Quote Detail uses exact per-quote filtering.</li>
  <li><strong>Period comparison</strong> &mdash; the previous period is the same-length window immediately before the current range. Deltas show absolute change; arrows indicate direction.</li>
</ul>

<h2>Billing Assumptions</h2>
<ul>
  <li><strong>Billable units</strong> = non-MANUAL line items + populated header fields (7 possible: customerName, customerEmail, customerPhone, accountNumber, deliveryAddress, requestedDeliveryDate, notes) + <code>rerunCount</code> per line item.</li>
  <li><strong>Cost per ingestion</strong> = <code>min(units &times; perUnitRateCents, perIngestionCapCents)</code>. When the cap is hit, the excess is tracked as <code>capSavingsCents</code>.</li>
  <li><strong>Monthly minimum</strong> applies at the dealer level via <code>monthlyMinimumCents</code>.</li>
  <li><strong>AI cost</strong> = sum of <code>extractionCost</code> + <code>matchingCost</code> + <code>resolutionCost</code> from the LLM API calls.</li>
  <li><strong>Margin</strong> = <code>(revenue &minus; AI cost) / revenue</code>, floored at 0%.</li>
</ul>

<h2>Metric Definitions</h2>
<ul>
  <li><strong>Match Rate</strong> &mdash; <code>matchedLineItems / totalLineItems</code>. A line item is "matched" if it has a non-null <code>matchedProductSku</code>.</li>
  <li><strong>Correction Rate</strong> &mdash; <code>correctedItems / matchedLineItems</code>. A correction is detected when <code>matchedProductSku &ne; aiOriginalMatch.matchedProductSku</code> (the user changed the AI's initial match).</li>
  <li><strong>Rules %</strong> &mdash; fraction of matches resolved by the deterministic rules engine vs. LLM vs. manual.</li>
  <li><strong>Conversion</strong> &mdash; <code>convertedQuotes / completedQuotes</code>. A quote is "converted" when <code>convertedQuoteId</code> is populated.</li>
</ul>

<h2>Match Tier Hierarchy</h2>
<div style="overflow-x:auto">
<table>
  <thead><tr><th>Tier</th><th>Name</th><th>Description</th></tr></thead>
  <tbody>
    <tr><td>0</td><td>Exact SKU</td><td>Input matches a catalog SKU exactly</td></tr>
    <tr><td>1</td><td>Dealer Rules</td><td>Matched by a dealer-specific tip/synonym rule</td></tr>

    <tr><td>2.5</td><td>Structured Resolved</td><td>Attributes narrow to a small set, resolved deterministically</td></tr>
    <tr><td>2.7</td><td>Product Identity</td><td>Product identity match (e.g. different packaging)</td></tr>
    <tr><td>3+</td><td>LLM Fallback</td><td>Sent to the LLM for semantic matching</td></tr>

</table>
