    position: absolute;
    pointer-events: none;

    border: 1px solid var(--tooltip-border);
    border-radius: 6px;
    padding: 7px 10px;
    color: var(--text-primary);

    // US-Mexico border
    var mxBorder = [
      [-117.2,32.7],[-114,32.5],[-111,31.3],[-108.5,31.5],
      [-106.5,31.8],[-104.5,29.5],[-101,28],[-99,27],[-97.5,26],[-97,25.8]
    ];
    drawLine(baseCtx, mxBorder, borderCountry, 0.8);

    // Some simplified internal lines for geographic context
    // These follow major geographic/political boundaries very roughly
    var internalLines = [
      // Mississippi River corridor
      [[-90,47.5],[-91,46],[-91.2,44.5],[-91,43],[-90.5,41.5],[-90.5,40],
       [-89.5,38.5],[-89.5,37],[-89,35.5],[-89.5,33.5],[-90,32],[-91,30.5]],
      // Rockies front range
      [[-105,49],[-105,47],[-105,45],[-105,43],[-105,41],[-104.5,39],
       [-104.5,37],[-104,35],[-103.5,33],[-103,31]],
      // 100th meridian (Great Plains divide)
      [[-100,49],[-100,46],[-100,43],[-100,40],[-100,37],[-100,34],[-100,31]],
      // Appalachian line
      [[-80,43],[-80,41],[-80,39],[-79.5,37],[-80,35.5],[-81.5,34],
       [-83,33],[-85,31.5],[-87,30.5]],
      // East coast state boundaries approximate
      [[-75.5,42],[-75.5,40],[-76,38.5],[-77,36.5]],
      // Ohio River
      [[-80.5,40],[-82,39],[-84,38.5],[-86,38],[-88,37]],
    ];
    internalLines.forEach(function(line) {
      drawLine(baseCtx, line, borderState, 0.4);
    });

    // Customer dots
    dots = [];
    var dotR = Math.max(2.5, Math.min(3.5, W / 320));

    customers.forEach(function(c) {
      var p = toXY(c[0], c[1]);
      var x = p[0], y = p[1];
      if (x < -30 || x > W + 30 || y < -30 || y > H + 30) return;
      dots.push({ x: x, y: y, company: c[2], store: c[3], r: dotR });
    });

    // Sort so smaller-count dots render on top (more visible)
    

    dots.forEach(function(d) {
      // Outer glow
      baseCtx.beginPath();
      baseCtx.arc(d.x, d.y, d.r + 2, 0, Math.PI * 2);
      baseCtx.fillStyle = dotGlow;
      baseCtx.fill();

      // Main dot
      baseCtx.beginPath();
      baseCtx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      baseCtx.fillStyle = dotFill;
      baseCtx.fill();
      baseCtx.strokeStyle = dotStroke;
      baseCtx.lineWidth = 0.8;
      baseCtx.stroke();
    });

    // Clear overlay
    overCtx.clearRect(0, 0, W, H);
  }

  // Hover
  var activeIdx = -1;

  function handleMove(mx, my) {
    var found = -1;
    var minD = Infinity;
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      var dist = Math.sqrt((mx - d.x) * (mx - d.x) + (my - d.y) * (my - d.y));
      if (dist < d.r + 10 && dist < minD) {
        minD = dist;
        found = i;
      }
    }

    if (found === activeIdx) return;
    activeIdx = found;

    overCtx.clearRect(0, 0, W, H);

    if (found === -1) {
      tooltipEl.classList.remove('visible');
      stack.style.cursor = 'default';
      return;
    }

    stack.style.cursor = 'pointer';
    var d = dots[found];

    // Highlight ring
    var hoverGlow = css('--dot-hover-glow');
    var hoverFill = css('--dot-hover-fill');

    overCtx.beginPath();
    overCtx.arc(d.x, d.y, d.r + 6, 0, Math.PI * 2);
    overCtx.fillStyle = hoverGlow;
    overCtx.fill();

    overCtx.beginPath();
    overCtx.arc(d.x, d.y, d.r + 1.5, 0, Math.PI * 2);
    overCtx.fillStyle = hoverFill;
    overCtx.fill();

    // Tooltip
    var html = '<div class="t-name">' + d.company + '</div>';
    html += '<div class="t-count">' + d.store + '</div>';
    tooltipEl.innerHTML = html;
    tooltipEl.classList.add('visible');

    var tx = d.x + 16;
    var ty = d.y - 36;
    // Measure after content set
    var tw = tooltipEl.offsetWidth;
    var th = tooltipEl.offsetHeight;
    if (tx + tw > W - 8) tx = d.x - tw - 16;
    if (ty < 4) ty = d.y + 16;
    if (ty + th > H - 4) ty = H - th - 4;
    tooltipEl.style.left = tx + 'px';
    tooltipEl.style.top = ty + 'px';
  }

  stack.addEventListener('mousemove', function(e) {
    var rect = baseCanvas.getBoundingClientRect();
    handleMove(e.clientX - rect.left, e.clientY - rect.top);
  });

  stack.addEventListener('mouseleave', function() {
    activeIdx = -1;
    overCtx.clearRect(0, 0, W, H);
    tooltipEl.classList.remove('visible');
    stack.style.cursor = 'default';
  });

  stack.addEventListener('touchstart', function(e) {
    var t = e.touches[0];
    var rect = baseCanvas.getBoundingClientRect();
    var mx = t.clientX - rect.left;
    var my = t.clientY - rect.top;
    var found = -1;
    var minD = Infinity;
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      var dist = Math.sqrt((mx - d.x) * (mx - d.x) + (my - d.y) * (my - d.y));
      if (dist < d.r + 18 && dist < minD) { minD = dist; found = i; }
    }
    if (found !== -1) {
      e.preventDefault();
      activeIdx = found;
      var d = dots[found];
      overCtx.clearRect(0, 0, W, H);
      overCtx.beginPath();
      overCtx.arc(d.x, d.y, d.r + 6, 0, Math.PI * 2);
      overCtx.fillStyle = css('--dot-hover-glow');
      overCtx.fill();
      overCtx.beginPath();
      overCtx.arc(d.x, d.y, d.r + 1.5, 0, Math.PI * 2);
      overCtx.fillStyle = css('--dot-hover-fill');
      overCtx.fill();
      var html = '<div class="t-name">' + d.company + '</div>';
      html += '<div class="t-count">' + d.store + '</div>';
      tooltipEl.innerHTML = html;
      tooltipEl.classList.add('visible');
      tooltipEl.style.left = (d.x + 16) + 'px';
      tooltipEl.style.top = (d.y - 36) + 'px';
      setTimeout(function() {
        tooltipEl.classList.remove('visible');
        overCtx.clearRect(0, 0, W, H);
        activeIdx = -1;
      }, 2200);
    }
  }, { passive: false });

  renderBase();

  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() { renderBase(); }, 80);
  });

  new MutationObserver(function() { renderBase(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
    renderBase();
  });
})();
</script>
